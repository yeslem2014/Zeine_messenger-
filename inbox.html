<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeine Messenger - الدردشة</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    
    <!-- ملفات التطبيق (بالترتيب) -->
    <script src="js/firebase-init.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/media.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
    
    <!-- ملف بدء التشغيل الرئيسي -->
    <script src="js/script.js"></script>
</head>
<body>

<header>
    <div class="header-right">
        <i class="fas fa-ellipsis-v" onclick="window.toggleSettingsPopup()"></i>
        <i class="fas fa-bars" id="roomsMenuBtn" onclick="window.toggleRoomsPopup()"></i>
    </div>
    <div class="app-name">Zeine_messenger</div>
    <div class="header-left">
        <i class="fas fa-trash-alt" id="clearIcon" onclick="window.clearAll()" style="display:none; cursor:pointer;"></i>
        <i class="fas fa-phone-alt" onclick="window.makeVoiceCall()"></i>
        <i class="fas fa-video" onclick="window.makeVideoCall()"></i>
        <button class="save-chat-btn" onclick="window.exportChat()">💾 حفظ</button>
        <span class="exit-x" onclick="window.logout()">X</span>
    </div>
</header>

<div id="roomsPopup" class="rooms-popup"></div>
<div id="chat"></div>

<div id="attachMenu">
    <div class="menu-item" onclick="window.openCamera()"><span>الكاميرا</span><i class="fas fa-camera"></i></div>
    <div class="menu-item" onclick="window.sendLocation()"><span>الموقع</span><i class="fas fa-map-marker-alt"></i></div>
    <div class="menu-item" onclick="window.uploadImageFromGallery()"><span>المعرض</span><i class="fas fa-image"></i></div>
    <div class="menu-item" onclick="window.shareChat()"><span>مشاركة</span><i class="fas fa-share-alt"></i></div>
</div>

<div id="bar">
    <div class="tools-right">
        <i class="fas fa-microphone" id="micBtn"></i>
        <i class="fas fa-paperclip" id="clipBtn"></i>
    </div>
    <input type="text" id="msgInput" placeholder="اكتب رسالة..." enterkeyhint="send" autocomplete="off">
</div>

<input type="file" id="galleryFile" accept="image/*" style="display:none" onchange="window.handleImageUpload(this)">
<input type="file" id="cameraFile" accept="image/*" capture="environment" style="display:none" onchange="window.handleImageUpload(this)">
<audio id="notifSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3" preload="auto"></audio>

</body>
</html>
