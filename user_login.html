<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Zeine Messenger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #008080;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 300px;
        }
        .code-box {
            background: rgba(255,255,255,0.95);
            border-radius: 60px;
            padding: 15px 20px;
            display: inline-block;
            margin-bottom: 30px;
        }
        .code-box input {
            width: 200px;
            height: 60px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            border: none;
            background: transparent;
            outline: none;
            font-family: monospace;
            letter-spacing: 8px;
        }
        .check-btn {
            background: #25d366;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 40px;
            cursor: pointer;
            color: white;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="code-box">
        <input type="password" id="roomCode" maxlength="4" placeholder="____" autocomplete="off">
    </div>
    <br>
    <button class="check-btn" onclick="checkAndGo()">✅</button>
</div>

<script>
    const VALID_ROOMS = {
        "1111": "general",
        "2222": "family",
        "3333": "friends",
        "4444": "private"
    };
    
    function checkAndGo() {
        const code = document.getElementById('roomCode').value.trim();
        if (!code || !VALID_ROOMS[code]) {
            alert("كود الغرفة غير صحيح!");
            document.getElementById('roomCode').value = '';
            return;
        }
        
        const targetRoom = VALID_ROOMS[code];
        
        let savedUser = JSON.parse(localStorage.getItem('zeine_user') || '{}');
        let userName = savedUser.name;
        let userPhone = savedUser.phone;
        
        if (!userName || !userPhone) {
            userName = prompt("أدخل اسمك الكريم:");
            if (!userName || userName.trim() === "" || userName.trim().toLowerCase() === "zeine") return;
            userPhone = prompt("أدخل رقم هاتفك:");
            if (!userPhone || userPhone.trim() === "") return;
        }
        
        const userData = {
            name: userName.trim(),
            phone: userPhone.trim(),
            room: targetRoom,
            role: 'member',
            isAdmin: false,
            loginTime: new Date().toISOString()
        };
        
        localStorage.setItem('zeine_user', JSON.stringify(userData));
        localStorage.setItem('zeine_room', targetRoom);
        sessionStorage.setItem('zeine_auth', 'true');
        sessionStorage.setItem('zeine_role', 'member');
        
        window.location.href = 'inbox.html';
    }
    
    document.getElementById('roomCode').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkAndGo();
    });
</script>
</body>
</html>
