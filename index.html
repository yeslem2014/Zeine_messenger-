<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeine Messenger</title>
    <style>
        :root { --wa-green: #075e54; --wa-light: #25d366; --bg-chat: #e5ddd5; }
        body { font-family: sans-serif; background: var(--bg-chat); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* رأس الصفحة */
        .header { background: var(--wa-green); color: white; padding: 15px; display: flex; align-items: center; gap: 10px; font-weight: bold; }
        
        /* منطقة الرسائل */
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 85%; padding: 10px; border-radius: 10px; position: relative; font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { background: #dcf8c6; align-self: flex-end; }
        audio { width: 100%; height: 45px; }

        /* شريط الأدوات السفلي - مثل واتساب */
        .footer { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #ddd; }
        .input-group { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 15px; gap: 10px; }
        input[type="text"] { border: none; flex: 1; padding: 10px; outline: none; font-size: 16px; }
        
        /* الأزرار */
        .btn-icon { background: none; border: none; cursor: pointer; font-size: 20px; color: #555; padding: 5px; }
        .main-btn { background: var(--wa-green); color: white; width: 50px; height: 50px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .recording { background: #d32f2f !important; animation: pulse 1s infinite; }

        /* الكاميرا */
        #cameraPreview { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; flex-direction: column; z-index: 1000; }
        video { flex: 1; width: 100%; object-fit: cover; }
        .cam-controls { background: rgba(0,0,0,0.5); padding: 20px; display: flex; justify-content: space-around; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="header">🟢 نظام Zeine - دردشة العائلة</div>

<div id="chatBox"></div>

<div id="cameraPreview">
    <video id="video" autoplay playsinline></video>
    <div class="cam-controls">
        <button class="btn-icon" style="color:white; font-size:30px;" onclick="closeCamera()">❌</button>
        <button class="btn-icon" style="color:white; font-size:40px;" onclick="takePhoto()">📸</button>
        <button class="btn-icon" style="color:white; font-size:30px;" onclick="switchCamera()">🔄</button>
    </div>
</div>

<div class="footer">
    <div class="input-group">
        <button class="btn-icon" onclick="openCamera()">📷</button>
        <button class="btn-icon" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="file" id="fileInput" hidden onchange="sendFile(this.files[0])">
        <input type="text" id="textMsg" placeholder="رسالة">
    </div>
    
    <button id="mainBtn" class="main-btn">🎤</button>
</div>

<script>
    // --- متغيرات الصوت (كودك الناجح) ---
    let audioCtx, processor, streamObj, audioLeft = [], audioLength = 0, isRecording = false;
    const mainBtn = document.getElementById('mainBtn');
    const textInput = document.getElementById('textMsg');

    // --- وظيفة زر الإرسال / الميكروفون ---
    mainBtn.onclick = async () => {
        if (textInput.value.trim() !== "" && !isRecording) {
            sendText();
            return;
        }

        if (isRecording) {
            stopMic();
        } else {
            startMic();
        }
    };

    // تغيير الرمز عند الكتابة
    textInput.oninput = () => {
        mainBtn.innerHTML = textInput.value.trim() !== "" ? "🚀" : "🎤";
    };

    function sendText() {
        addMsg(textInput.value, 'sent');
        textInput.value = "";
        mainBtn.innerHTML = "🎤";
    }

    async function startMic() {
        try {
            streamObj = await navigator.mediaDevices.getUserMedia({ audio: true });
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaStreamSource(streamObj);
            processor = audioCtx.createScriptProcessor(4096, 1, 1);
            audioLeft = []; audioLength = 0; isRecording = true;

            processor.onaudioprocess = (e) => {
                if (!isRecording) return;
                const left = e.inputBuffer.getChannelData(0);
                audioLeft.push(new Float32Array(left));
                audioLength += left.length;
            };
            source.connect(processor); processor.connect(audioCtx.destination);
            mainBtn.classList.add('recording');
        } catch (e) { alert("الميكروفون مطلوب"); }
    }

    function stopMic() {
        isRecording = false;
        mainBtn.classList.remove('recording');
        if (processor) processor.disconnect();
        if (streamObj) streamObj.getTracks().forEach(t => t.stop());
        
        const buffer = new Float32Array(audioLength);
        let offset = 0;
        for (let i = 0; i < audioLeft.length; i++) {
            buffer.set(audioLeft[i], offset);
            offset += audioLeft[i].length;
        }
        const url = URL.createObjectURL(createWavBlob(buffer, audioCtx.sampleRate));
        addMsg(`<audio src="${url}" controls></audio>`, 'sent');
    }

    // --- الكاميرا والملفات ---
    let currentFacingMode = "user";
    function openCamera() {
        document.getElementById('cameraPreview').style.display = 'flex';
        startVideo();
    }

    async function startVideo() {
        if (streamObj) streamObj.getTracks().forEach(t => t.stop());
        streamObj = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
        document.getElementById('video').srcObject = streamObj;
    }

    function switchCamera() {
        currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
        startVideo();
    }

    function takePhoto() {
        const video = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        addMsg(`<img src="${canvas.toDataURL()}" style="width:100%; border-radius:10px;">`, 'sent');
        closeCamera();
    }

    function closeCamera() {
        document.getElementById('cameraPreview').style.display = 'none';
        if (streamObj) streamObj.getTracks().forEach(t => t.stop());
    }

    function sendFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            if (file.type.startsWith('image/')) {
                addMsg(`<img src="${e.target.result}" style="width:100%; border-radius:10px;">`, 'sent');
            } else {
                addMsg(`📎 ملف: ${file.name}`, 'sent');
            }
        };
        reader.readAsDataURL(file);
    }

    function addMsg(content, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = content;
        document.getElementById('chatBox').appendChild(div);
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    // دالة WAV (كودك الأصلي)
    function createWavBlob(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeString = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
        writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true);
        writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        writeString(view, 36, 'data'); view.setUint32(40, samples.length * 2, true);
        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
            let s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
    }
</script>
</body>
</html>
