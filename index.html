<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-green: #075e54; --chat-bg: #efe7de; --my-msg: #dcf8c6; }
        
        body { font-family: sans-serif; background: var(--chat-bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* الهيدر العلوي */
        #header { background: var(--main-green); color: white; padding: 15px; text-align: center; font-weight: bold; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        /* منطقة البث المباشر */
        #videoArea { width: 100%; display: none; background: #000; line-height: 0; border-bottom: 3px solid #128c7e; }
        video { width: 100%; height: auto; max-height: 40vh; object-fit: cover; }

        /* منطقة الدردشة */
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .msg { background: var(--my-msg); padding: 10px 15px; border-radius: 15px; align-self: flex-end; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .img-msg { align-self: flex-end; max-width: 70%; border-radius: 10px; overflow: hidden; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .img-msg img { width: 100%; display: block; }

        /* شريط الإدخال السفلي المحسن */
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #ddd; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
        i { color: #51585c; font-size: 24px; cursor: pointer; padding: 5px; }
        .active { color: #128c7e !important; }
    </style>
</head>
<body>

    <div id="header">نظام تواصل العائلة</div>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <i class="fas fa-video" id="btnStream" title="تشغيل البث"></i>
        <i class="fas fa-camera" id="btnCapture" title="التقاط صورة"></i>
        <i class="fas fa-microphone" id="btnMic"></i>
        <input type="text" id="userInput" placeholder="اكتب رسالة..." enterkeyhint="send">
        <i class="fas fa-paper-plane" style="color:#128c7e" id="btnSend"></i>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const btnStream = document.getElementById('btnStream');
        const btnCapture = document.getElementById('btnCapture');
        const videoArea = document.getElementById('videoArea');
        const webcam = document.getElementById('webcam');
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const canvas = document.getElementById('canvas');

        let localStream = null;

        // 1. التحكم بالبث المباشر
        btnStream.onclick = async () => {
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
                videoArea.style.display = "none";
                btnStream.classList.remove('active');
            } else {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                    webcam.srcObject = localStream;
                    videoArea.style.display = "block";
                    btnStream.classList.add('active');
                    webcam.play();
                } catch (e) { alert("تأكد من إعدادات السماح للكاميرا"); }
            }
        };

        // 2. التقاط صورة من البث وإرسالها فوراً
        btnCapture.onclick = () => {
            if (localStream) {
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;
                canvas.getContext('2d').drawImage(webcam, 0, 0);
                const data = canvas.toDataURL('image/jpeg');
                const div = document.createElement('div');
                div.className = 'img-msg';
                div.innerHTML = `<img src="${data}">`;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            } else {
                alert("شغل البث أولاً");
            }
        };

        // 3. إرسال النص
        function sendText() {
            if (userInput.value.trim()) {
                const div = document.createElement('div');
                div.className = 'msg';
                div.textContent = userInput.value;
                chat.appendChild(div);
                userInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        document.getElementById('btnSend').onclick = sendText;
        userInput.onkeypress = (e) => { if(e.key === "Enter") sendText(); };

        // الميكروفون
        document.getElementById('btnMic').onclick = async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('btnMic').classList.add('active');
            } catch (e) { alert("تحقق من الإذن"); }
        };
    </script>
</body>
</html>
