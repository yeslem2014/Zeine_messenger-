<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #status { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        
        /* مربع الفيديو */
        #videoContainer { width: 90%; margin: 10px auto; display: none; border-radius: 15px; overflow: hidden; border: 3px solid #128c7e; position: relative; }
        video { width: 100%; display: block; background: #000; }

        .msg { background: #dcf8c6; padding: 10px 15px; border-radius: 15px; align-self: flex-end; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #ddd; z-index: 1000; }
        .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
        i { color: #51585c; font-size: 24px; cursor: pointer; }
        .send-btn { color: #128c7e !important; }
    </style>
</head>
<body>

    <div id="status">نظام تواصل العائلة - متصل</div>

    <div id="chatBox">
        <div id="videoContainer">
            <video id="myVideo" autoplay playsinline muted></video>
        </div>
        </div>

    <div class="input-area">
        <i class="fas fa-camera" id="camBtn"></i>
        <i class="fas fa-microphone" id="micBtn"></i>
        <input type="text" id="msgInput" placeholder="اكتب رسالة...">
        <i class="fas fa-paper-plane send-btn" id="sendBtn"></i>
    </div>

    <script>
        const camBtn = document.getElementById('camBtn');
        const videoCont = document.getElementById('videoContainer');
        const myVideo = document.getElementById('myVideo');
        const sendBtn = document.getElementById('sendBtn');
        const msgInput = document.getElementById('msgInput');
        const chatBox = document.getElementById('chatBox');

        // تشغيل الكاميرا وعرضها
        camBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                myVideo.srcObject = stream;
                videoCont.style.display = "block";
                chatBox.scrollTop = 0; // لرفع الفيديو للأعلى
            } catch (e) {
                alert("يرجى السماح بالوصول للكاميرا");
            }
        };

        // الميكروفون (اختبار)
        document.getElementById('micBtn').onclick = async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                alert("الميكروفون متصل وجاهز");
            } catch (e) {
                alert("يرجى السماح بالوصول للميكروفون");
            }
        };

        // إرسال الرسالة
        sendBtn.onclick = () => {
            if (msgInput.value.trim() !== "") {
                const div = document.createElement('div');
                div.className = 'msg';
                div.textContent = msgInput.value;
                chatBox.appendChild(div);
                msgInput.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };
    </script>
</body>
</html>
