<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeine Messenger Pro</title>
    <style>
        body { font-family: sans-serif; background-color: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #075e54; color: white; padding: 25px; text-align: center; font-size: 22px; font-weight: bold; }
        
        /* منطقة الرسائل - جعلتها واضحة وكبيرة */
        #chatBox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .voice-bubble { 
            background: white; padding: 20px; border-radius: 20px 20px 0 20px; 
            align-self: flex-end; width: 90%; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-right: 8px solid #25d366;
        }

        audio { width: 100%; height: 55px; } /* شريط صوت ضخم وسهل التحكم */

        /* منطقة التحكم - أزرار عملاقة */
        .bottom-bar { background: #f0f0f0; padding: 40px 20px; border-top: 2px solid #ddd; text-align: center; }
        
        #recordBtn { 
            width: 100px; height: 100px; border-radius: 50%; border: none; 
            background: #075e54; color: white; font-size: 40px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3); transition: 0.3s;
        }

        .recording-now { background: #d32f2f !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        #infoText { margin-top: 20px; font-size: 18px; color: #333; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">نظام Zeine المطور</div>

<div id="chatBox"></div>

<div class="bottom-bar">
    <button id="recordBtn">🎤</button>
    <div id="infoText">اضغط لبدء التحدث</div>
</div>

<script>
    let rec;
    let stream;
    let audioChunks = [];

    const btn = document.getElementById('recordBtn');
    const info = document.getElementById('infoText');
    const box = document.getElementById('chatBox');

    btn.onclick = async () => {
        if (rec && rec.state === "recording") {
            rec.stop();
            btn.classList.remove('recording-now');
            btn.innerHTML = "🎤";
            info.innerText = "تم الحفظ بنجاح";
            return;
        }

        try {
            // طلب الميكروفون بأعلى جودة ممكنة لسامسونج
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // محاولة استخدام أفضل صيغة يدعمها المتصفح
            const types = ["audio/webm", "audio/mp4", "audio/ogg", "audio/wav"];
            let supportedType = types.find(t => MediaRecorder.isTypeSupported(t));

            rec = new MediaRecorder(stream, { mimeType: supportedType });
            audioChunks = [];

            rec.ondataavailable = e => audioChunks.push(e.data);

            rec.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: supportedType });
                const audioUrl = URL.createObjectURL(audioBlob);
                
                // إنشاء الفقاعة
                const div = document.createElement('div');
                div.className = 'voice-bubble';
                div.innerHTML = `
                    <audio src="${audioUrl}" controls></audio>
                    <div style="margin-top:10px; color:#666; font-size:14px;">تسجيل جديد ✅</div>
                `;
                box.appendChild(div);
                box.scrollTop = box.scrollHeight;

                // إيقاف الميكروفون تماماً
                stream.getTracks().forEach(t => t.stop());
            };

            rec.start();
            btn.classList.add('recording-now');
            btn.innerHTML = "⏹️";
            info.innerText = "جاري التسجيل... انقر للإيقاف";

        } catch (err) {
            alert("خطأ: يرجى التأكد من تفعيل الميكروفون في إعدادات الهاتف لمتصفح كروم");
        }
    };
</script>

</body>
</html>
