<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام التواصل النهائي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        
        #videoArea { width: 100%; display: none; background: #000; position: relative; }
        video { width: 100%; height: 280px; object-fit: cover; border-bottom: 3px solid #128c7e; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .msg { background: #dcf8c6; padding: 10px; border-radius: 10px; align-self: flex-end; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        .input-bar { position: fixed; bottom: 0; width: 100%; background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 8px; box-sizing: border-box; border-top: 1px solid #ccc; z-index: 1000; }
        
        /* تحويل الأيقونات إلى أزرار فعلية لضمان الاستجابة */
        button { background: none; border: none; padding: 8px; cursor: pointer; color: #51585c; outline: none; -webkit-tap-highlight-color: transparent; }
        button i { font-size: 24px; }
        .active { color: #128c7e !important; }
        
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة</header>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <button id="btnSwitch"><i class="fas fa-sync"></i></button>
        <button id="btnStream"><i class="fas fa-video"></i></button>
        <button id="btnCapture"><i class="fas fa-camera"></i></button>
        <button id="btnMic"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="اكتب رسالة...">
        <button id="btnSend"><i class="fas fa-paper-plane" style="color:#128c7e"></i></button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const btnStream = document.getElementById('btnStream');
        const btnSwitch = document.getElementById('btnSwitch');
        const btnMic = document.getElementById('btnMic');
        const webcam = document.getElementById('webcam');
        const videoArea = document.getElementById('videoArea');
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const canvas = document.getElementById('canvas');

        let stream = null;
        let isRear = false;

        async function startMedia() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            
            try {
                // طلب الفيديو والميكروفون في أمر واحد
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: isRear ? "environment" : "user" }, 
                    audio: true 
                });
                webcam.srcObject = stream;
                videoArea.style.display = "block";
                btnStream.classList.add('active');
                btnMic.classList.add('active');
                
                // التأكد من تفعيل الميكروفون برمجياً
                const audioTrack = stream.getAudioTracks()[0];
                if (audioTrack) audioTrack.enabled = true;

            } catch (e) {
                alert("يرجى الضغط على 'سماح' للوصول للكاميرا والميكروفون");
            }
        }

        btnStream.onclick = () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                videoArea.style.display = "none";
                btnStream.classList.remove('active');
                btnMic.classList.remove('active');
            } else {
                startMedia();
            }
        };

        btnSwitch.onclick = () => {
            isRear = !isRear;
            if (stream) startMedia();
        };

        btnMic.onclick = () => {
            if (!stream) {
                startMedia();
            } else {
                const audioTrack = stream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                btnMic.classList.toggle('active', audioTrack.enabled);
            }
        };

        document.getElementById('btnCapture').onclick = () => {
            if (stream) {
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;
                canvas.getContext('2d').drawImage(webcam, 0, 0);
                const div = document.createElement('div');
                div.className = 'msg';
                div.style.background = "none";
                div.innerHTML = `<img src="${canvas.toDataURL('image/jpeg')}" style="width:100%; border-radius:10px; border:2px solid white;">`;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            }
        };

        document.getElementById('btnSend').onclick = () => {
            if (userInput.value.trim()) {
                const div = document.createElement('div');
                div.className = 'msg';
                div.textContent = userInput.value;
                chat.appendChild(div);
                userInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        };
    </script>
</body>
</html>
