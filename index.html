<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>نظام التواصل</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; background: #efe7de; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; }
        #videoArea { width: 100%; display: none; background: #000; }
        video { width: 100%; height: 250px; object-fit: cover; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        .img-msg { align-self: flex-end; max-width: 70%; border-radius: 10px; border: 2px solid white; }
        .img-msg img { width: 100%; display: block; }
        .input-bar { position: fixed; bottom: 0; width: 100%; background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 12px; box-sizing: border-box; }
        i { font-size: 24px; cursor: pointer; color: #51585c; }
        .active { color: #128c7e; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <header>نظام تواصل العائلة</header>
    <div id="videoArea"><video id="webcam" autoplay playsinline></video></div>
    <div id="chat"></div>
    <div class="input-bar">
        <i class="fas fa-video" id="btnStream" title="كاميرا خلفية"></i>
        <i class="fas fa-camera" id="btnCapture"></i>
        <i class="fas fa-microphone" id="btnMic"></i>
        <input type="text" id="userInput" placeholder="اكتب...">
        <i class="fas fa-paper-plane" id="btnSend"></i>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const btnStream = document.getElementById('btnStream');
        const btnMic = document.getElementById('btnMic');
        const webcam = document.getElementById('webcam');
        let stream = null;

        // تفعيل الكاميرا الخلفية والميكروفون معاً
        btnStream.onclick = async () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                document.getElementById('videoArea').style.display = "none";
                btnStream.classList.remove('active');
            } else {
                try {
                    // طلب الكاميرا الخلفية (environment) والميكروفون
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { exact: "environment" } }, 
                        audio: true 
                    });
                    webcam.srcObject = stream;
                    document.getElementById('videoArea').style.display = "block";
                    btnStream.classList.add('active');
                } catch (e) {
                    // إذا فشل طلب الكاميرا الخلفية تحديداً، يطلب أي كاميرا متاحة
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    webcam.srcObject = stream;
                    document.getElementById('videoArea').style.display = "block";
                }
            }
        };

        // التقاط الصورة
        document.getElementById('btnCapture').onclick = () => {
            if (stream) {
                const cvs = document.getElementById('canvas');
                cvs.width = webcam.videoWidth;
                cvs.height = webcam.videoHeight;
                cvs.getContext('2d').drawImage(webcam, 0, 0);
                const div = document.createElement('div');
                div.className = 'img-msg';
                div.innerHTML = `<img src="${cvs.toDataURL('image/jpeg')}">`;
                document.getElementById('chat').appendChild(div);
            }
        };

        // تفعيل الميكروفون منفصلاً
        btnMic.onclick = async () => {
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                btnMic.classList.add('active');
                console.log("الميكروفون نشط");
            } catch (e) { alert("تأكد من إذن الميكروفون"); }
        };
    </script>
</body>
</html>
