<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام العائلة النهائي</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #efe7de; font-family: sans-serif; }
        
        header { height: 55px; background: #075e54; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* منطقة الفيديو */
        #videoArea { position: absolute; top: 55px; left: 0; right: 0; height: 230px; background: #000; display: none; z-index: 10; border-bottom: 3px solid #25d366; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #chat { position: absolute; top: 55px; bottom: 85px; left: 0; right: 0; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5; transition: top 0.3s; }
        .msg { background: white; padding: 10px; border-radius: 12px; align-self: flex-start; max-width: 85%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .my-msg { background: #dcf8c6; align-self: flex-end; }
        .msg img { max-width: 100%; border-radius: 8px; display: block; margin-top: 5px; }

        .footer { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 85px;
            background: #ffffff; display: flex; align-items: center; justify-content: space-around;
            padding: 5px; border-top: 2px solid #25d366; z-index: 1000;
        }

        .btn-text { 
            background: #f0f0f0; border: 1px solid #ddd; padding: 5px 8px; 
            border-radius: 8px; font-weight: bold; font-size: 11px;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            min-width: 45px; cursor: pointer; color: #075e54;
        }
        
        .btn-text span { font-size: 18px; }
        .active-btn { background: #25d366 !important; color: white !important; }
        .muted-btn { background: #ff4d4d !important; color: white !important; }

        input { flex: 1; border: 1px solid #ddd; padding: 10px; border-radius: 20px; outline: none; margin: 0 5px; font-size: 14px; }
        #sendBtn { background: #25d366; color: white; border: none; border-radius: 50%; width: 45px; height: 45px; font-weight: bold; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة</header>

    <div id="videoArea">
        <video id="v" autoplay playsinline muted></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="chat"></div>

    <div class="footer">
        <div class="btn-text" id="tglCam"><span>🔄</span>تبديل</div>
        <div class="btn-text" id="tglMic"><span>🎤</span>صوت</div>
        <div class="btn-text" id="tglVid"><span>📷</span>فيديو</div>
        <div class="btn-text" id="takePic"><span>🖼️</span>صورة</div>

        <input type="text" id="m" placeholder="اكتب...">
        <button id="sendBtn">ارسال</button>
    </div>

    <script>
        const v = document.getElementById('v'), chat = document.getElementById('chat'), m = document.getElementById('m');
        const vArea = document.getElementById('videoArea'), canvas = document.getElementById('canvas');
        const tglVid = document.getElementById('tglVid'), tglMic = document.getElementById('tglMic');

        let stream = null, isRear = true;

        // استعادة المحادثة
        window.onload = () => {
            const saved = localStorage.getItem('chat_history');
            if (saved) { chat.innerHTML = saved; chat.scrollTop = chat.scrollHeight; }
        };

        async function startMedia() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: isRear ? "environment" : "user" },
                    audio: true
                });
                v.srcObject = stream;
                v.onloadedmetadata = () => { v.play(); v.muted = false; };
                vArea.style.display = "block";
                chat.style.top = "285px";
                tglVid.classList.add('active-btn');
                tglMic.classList.add('active-btn');
            } catch (e) { alert("يرجى السماح بالكاميرا"); }
        }

        tglVid.onclick = () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                vArea.style.display = "none";
                chat.style.top = "55px";
                tglVid.classList.remove('active-btn');
                tglMic.classList.remove('active-btn', 'muted-btn');
                stream = null;
            } else { startMedia(); }
        };

        document.getElementById('tglCam').onclick = () => { isRear = !isRear; if(stream) startMedia(); };

        tglMic.onclick = () => {
            if (stream) {
                const track = stream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                tglMic.classList.toggle('muted-btn', !track.enabled);
                tglMic.classList.toggle('active-btn', track.enabled);
            }
        };

        document.getElementById('takePic').onclick = () => {
            if (stream) {
                canvas.width = v.videoWidth; canvas.height = v.videoHeight;
                canvas.getContext('2d').drawImage(v, 0, 0);
                addMsg(`<img src="${canvas.toDataURL('image/png')}">`);
            } else { alert("افتح الكاميرا أولاً"); }
        };

        function addMsg(c, isMy = true) {
            const d = document.createElement('div');
            d.className = 'msg' + (isMy ? ' my-msg' : '');
            d.innerHTML = c;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
            localStorage.setItem('chat_history', chat.innerHTML);
        }

        document.getElementById('sendBtn').onclick = () => {
            if (m.value.trim()) { addMsg(m.value); m.value = ""; }
        };
    </script>
</body>
</html>
