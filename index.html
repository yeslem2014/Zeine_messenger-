<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeine Messenger Pro</title>
    <style>
        :root { --wa-green: #075e54; --bg-chat: #e5ddd5; }
        body { font-family: sans-serif; background: var(--bg-chat); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: var(--wa-green); color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        #chatArea { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 16px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .sent { background: #dcf8c6; align-self: flex-end; }
        .footer { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 8px; }
        .input-box { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 15px; }
        input { border: none; flex: 1; padding: 8px; outline: none; }
        .btn { background: var(--wa-green); color: white; width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 20px; }
        #camOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 999; }
        video { flex: 1; width: 100%; object-fit: cover; }
        .cam-controls { padding: 20px; display: flex; justify-content: space-around; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="header">نظام Zeine المطور</div>
<div id="chatArea"></div>

<div id="camOverlay">
    <video id="video" autoplay playsinline></video>
    <div class="cam-controls">
        <button onclick="closeCam()" style="color:white; background:none; border:none; font-size:30px;">✕</button>
        <button onclick="takeSnap()" style="color:white; background:none; border:none; font-size:40px;">📸</button>
    </div>
</div>

<div class="footer">
    <div class="input-box">
        <button onclick="openCam()" style="border:none; background:none; font-size:20px;">📷</button>
        <input type="text" id="textIn" placeholder="رسالة">
    </div>
    <button id="actionBtn" class="btn">🎤</button>
</div>

<script>
    let aCtx, proc, sObj, chunks = [], isRec = false;
    const btn = document.getElementById('actionBtn');
    const area = document.getElementById('chatArea');

    // كود التسجيل المضمون WAV
    btn.onclick = async () => {
        if (isRec) {
            isRec = false;
            btn.innerHTML = "🎤";
            if (sObj) sObj.getTracks().forEach(t => t.stop());
            const blob = encodeWav();
            addMsg(`<audio src="${URL.createObjectURL(blob)}" controls></audio>`, 'sent');
        } else {
            isRec = true;
            btn.innerHTML = "⏹";
            sObj = await navigator.mediaDevices.getUserMedia({ audio: true });
            aCtx = new AudioContext();
            const src = aCtx.createMediaStreamSource(sObj);
            proc = aCtx.createScriptProcessor(4096, 1, 1);
            chunks = [];
            proc.onaudioprocess = (e) => {
                if (isRec) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
            };
            src.connect(proc); proc.connect(aCtx.destination);
        }
    };

    function encodeWav() {
        let len = chunks.reduce((a, b) => a + b.length, 0);
        let buf = new Float32Array(len);
        let offset = 0;
        for (let c of chunks) { buf.set(c, offset); offset += c.length; }
        let wav = new ArrayBuffer(44 + buf.length * 2);
        let view = new DataView(wav);
        const s = (o, str) => { for (let i = 0; i < str.length; i++) view.setUint8(o + i, str.charCodeAt(i)); };
        s(0, 'RIFF'); view.setUint32(4, 36 + buf.length * 2, true);
        s(8, 'WAVE'); s(12, 'fmt '); view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); view.setUint16(22, 1, true);
        view.setUint32(24, aCtx.sampleRate, true); view.setUint32(28, aCtx.sampleRate * 2, true);
        view.setUint16(32, 2, true); view.setUint16(34, 16, true);
        s(36, 'data'); view.setUint32(40, buf.length * 2, true);
        let o = 44;
        for (let i = 0; i < buf.length; i++, o += 2) {
            let s = Math.max(-1, Math.min(1, buf[i]));
            view.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
    }

    async function openCam() {
        document.getElementById('camOverlay').style.display = 'flex';
        sObj = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('video').srcObject = sObj;
    }

    function closeCam() {
        document.getElementById('camOverlay').style.display = 'none';
        if (sObj) sObj.getTracks().forEach(t => t.stop());
    }

    function takeSnap() {
        const v = document.getElementById('video');
        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth; canvas.height = v.videoHeight;
        canvas.getContext('2d').drawImage(v, 0, 0);
        addMsg(`<img src="${canvas.toDataURL('image/png')}" style="width:100%">`, 'sent');
        closeCam();
    }

    function addMsg(html, type) {
        const d = document.createElement('div');
        d.className = `msg ${type}`;
        d.innerHTML = html;
        area.appendChild(d);
        area.scrollTop = area.scrollHeight;
    }
</script>
</body>
</html>
