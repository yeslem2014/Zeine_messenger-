<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #status { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* مكان عرض الفيديو */
        #videoDisplay { width: 100%; max-height: 300px; background: #000; display: none; border-radius: 10px; margin-bottom: 10px; }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        i { color: #51585c; font-size: 24px; cursor: pointer; }
        .send-btn { color: #128c7e !important; }
    </style>
</head>
<body>

    <div id="status">نظام تواصل العائلة - متصل</div>

    <div id="messages">
        <video id="videoDisplay" autoplay playsinline></video>
        <div id="chatBox"></div>
    </div>

    <div class="input-area">
        <i class="fas fa-camera" id="camBtn"></i>
        <i class="fas fa-microphone" id="micBtn"></i>
        <input type="text" id="userInput" placeholder="اكتب رسالة...">
        <i class="fas fa-paper-plane send-btn" id="sendBtn"></i>
    </div>

    <script>
        const camBtn = document.getElementById('camBtn');
        const video = document.getElementById('videoDisplay');

        // وظيفة تشغيل الكاميرا وعرضها في الصفحة
        camBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.style.display = "block"; // إظهار المربع الأسود وتحويله لكاميرا
            } catch (e) {
                alert("لم يتم تفعيل الكاميرا، تأكد من إعدادات المتصفح");
            }
        };

        // وظيفة الإرسال (لعرض الرسائل في الشاشة)
        document.getElementById('sendBtn').onclick = () => {
            const input = document.getElementById('userInput');
            if(input.value) {
                const msg = document.createElement('div');
                msg.textContent = input.value;
                msg.style.cssText = "background:#dcf8c6; padding:10px; border-radius:10px; align-self:flex-end;";
                document.getElementById('chatBox').appendChild(msg);
                input.value = "";
            }
        };
    </script>
</body>
</html>
