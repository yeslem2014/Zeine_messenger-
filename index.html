<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; }
        #status { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        .input-area { background: #ffffff; padding: 20px; display: flex; align-items: center; justify-content: space-around; border-top: 2px solid #128c7e; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; z-index: 9999; }
        .input-area i { color: #128c7e; font-size: 30px; cursor: pointer; }
        input { flex: 1; margin: 0 10px; padding: 10px; border-radius: 20px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div id="status">تم التحديث بنجاح - انظر للأسفل</div>
    
    <div style="flex: 1;"></div>

    <div class="input-area">
        <i class="fas fa-camera"></i>
        <i class="fas fa-microphone"></i>
        <input type="text" placeholder="اكتب هنا...">
        <i class="fas fa-paper-plane"></i>
    </div>
</body>
</html>
