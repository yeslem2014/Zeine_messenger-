<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeine Messenger - Owner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #008080;
            font-family: Arial, sans-serif;
            color: white;
        }
        .container { text-align: center; width: 90%; max-width: 400px; }
        .icons { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .icons i { font-size: 80px; }
        .user-icon { color: #3498db; }
        .shield-icon { color: #bdc3c7; }
        h1 { margin: 10px 0; font-size: 32px; }
        p { margin-bottom: 30px; font-size: 18px; opacity: 0.8; }
        input { width: 50%; padding: 15px; margin-bottom: 30px; border: none; border-radius: 30px; text-align: center; font-size: 18px; }
        button { width: 50%; padding: 15px; border: none; border-radius: 30px; background-color: #2ecc71; color: white; font-size: 18px; cursor: pointer; }
        .error-msg { margin-top: 20px; color: #ffaa66; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icons">
            <i class="fas fa-user-circle user-icon"></i>
            <i class="fas fa-shield-alt shield-icon"></i>
        </div>
        <h1>Zeine_messenger</h1>
        <p>Owner Code</p>
        <input type="password" id="ownerCode" placeholder="......">
        <button onclick="verifyOwnerCode()">Login</button>
        <div id="errorMsg" class="error-msg"></div>
    </div>
    <script>
        const OWNER_SECRET_CODE = "Y3745@";
        function verifyOwnerCode() {
            const code = document.getElementById('ownerCode').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.innerHTML = '';
            if (code === "") {
                errorDiv.innerHTML = '⚠️ الرجاء إدخال كود المالك';
                return;
            }
            if (code === OWNER_SECRET_CODE) {
                localStorage.setItem('zeine_owner', 'true');
                window.location.href = 'inbox.html';
            } else {
                errorDiv.innerHTML = '❌ كود المالك غير صحيح';
                document.getElementById('ownerCode').value = '';
            }
        }
        document.getElementById('ownerCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyOwnerCode();
        });
    </script>
</body>
</html>
