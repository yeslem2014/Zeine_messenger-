<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeine Messenger Pro</title>
    <style>
        :root { --wa-green: #075e54; --wa-light: #25d366; --bg-chat: #e5ddd5; }
        body { font-family: sans-serif; background: var(--bg-chat); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* رأس الصفحة */
        .header { background: var(--wa-green); color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* منطقة الرسائل */
        #chatArea { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        
        .msg { max-width: 85%; padding: 12px; border-radius: 12px; position: relative; font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); line-height: 1.4; }
        .sent { background: #dcf8c6; align-self: flex-end; border-bottom-left-radius: 2px; }
        audio { width: 100%; height: 45px; margin-top: 5px; }
        img { max-width: 100%; border-radius: 8px; margin-top: 5px; border: 1px solid #ddd; }

        /* شريط الإرسال السفلي */
        .footer { background: #f0f0f0; padding: 10px 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; }
        .input-container { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 12px; gap: 8px; }
        input[type="text"] { border: none; flex: 1; padding: 10px; outline: none; font-size: 16px; background: transparent; }
        
        .icon-btn { background: none; border: none; cursor: pointer; font-size: 22px; color: #555; padding: 5px; }
        .action-btn { background: var(--wa-green); color: white; width: 55px; height: 55px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .recording { background: #d32f2f !important; animation: pulse 1s infinite; }

        /* نافذة الكاميرا */
        #camOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; flex-direction: column; z-index: 2000; }
        video { flex: 1; width: 100%; object-fit: cover; }
        .cam-btns { background: rgba(0,0,0,0.8); padding: 30px; display: flex; justify-content: space-around; align-items: center; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="header">نظام Zeine المطور</div>

<div id="chatArea"></div>

<div id="camOverlay">
    <video id="v-stream" autoplay playsinline></video>
    <div class="cam-btns">
        <button class="icon-btn" style="color:white; font-size:35px;" onclick="stopCam()">✕</button>
        <button class="icon-btn" style="color:white; font-size:50px;" onclick="snap()">📸</button>
        <button class="icon-btn" style="color:white; font-size:35px;" onclick="flip()">🔄</button>
    </div>
</div>

<div class="footer">
    <div class="input-container">
        <button class="icon-btn" onclick="startCam()">📷</button>
        <button class="icon-btn" onclick="document.getElementById('f-up').click()">📎</button>
        <input type="file" id="f-up" hidden onchange="handleFile(this.files[0])">
        <input type="text" id="t-in" placeholder="رسالة">
    </div>
    <button id="main-action" class="action-btn">🎤</button>
</div>

<script>
    // --- المحافظة على كود الميكروفون الناجح (WAV) ---
    let aCtx, proc, sObj, aLeft = [], aLen = 0, isRec = false;
    const mBtn = document.getElementById('main-action');
    const tIn = document.getElementById('t-in');
    const area = document.getElementById('chatArea');

    // تبديل رمز الزر عند الكتابة
    tIn.oninput = () => {
        mBtn.innerHTML = tIn.value.trim() ? "🚀" : "🎤";
    };

    mBtn.onclick = async () => {
        // إذا كان هناك نص، يتم الإرسال بدلاً من التسجيل
        if (tIn.value.trim() !== "" && !isRec) {
            pushMsg(tIn.value, 'sent');
            tIn.value = "";
            mBtn.innerHTML = "🎤";
            return;
        }
        // إدارة تسجيل الصوت
        isRec ? endRec() : startRec();
    };

    async function startRec() {
        try {
            sObj = await navigator.mediaDevices.getUserMedia({ audio: true });
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            const src = aCtx.createMediaStreamSource(sObj);
            proc = aCtx.createScriptProcessor(4096, 1, 1);
            aLeft = []; aLen = 0; isRec = true;
            proc.onaudioprocess = (e) => {
                if (!isRec) return;
                const data = e.inputBuffer.getChannelData(0);
                aLeft.push(new Float32Array(data));
                aLen += data.length;
            };
            src.connect(proc); proc.connect(aCtx.destination);
            mBtn.classList.add('recording');
            mBtn.innerHTML = "⏹";
        } catch (e) { alert("يرجى السماح بالوصول للميكروفون"); }
    }

    function endRec() {
        isRec = false;
        mBtn.classList.remove('recording');
        mBtn.innerHTML = "🎤";
        if (proc) proc.disconnect();
        if (sObj) sObj.getTracks().forEach(t => t.stop());
        const buf = new Float32Array(aLen);
        let off = 0;
        for (let chunk of aLeft) { buf.set(chunk, off); off += chunk.length; }
        const url = URL.createObjectURL(makeWav(buf, aCtx.sampleRate));
        pushMsg(`<audio src="${url}" controls></audio>`, 'sent');
    }

    // --- وظائف الكاميرا والملفات ---
    let mode = "user"; // الكاميرا الأمامية افتراضياً
    async function startCam() {
        document.getElementById('camOverlay').style.display = 'flex';
        if (sObj) sObj.getTracks().forEach(t => t.stop());
        sObj = await navigator.mediaDevices.getUserMedia({ video: { facingMode: mode } });
        document.getElementById('v-stream').srcObject = sObj;
    }

    function flip() { 
        mode = mode === "user" ? "environment" : "user"; 
        startCam(); 
    }

    function snap() {
        const vid = document.getElementById('v-stream');
        const can = document.createElement('canvas');
        can.width = vid.videoWidth; can.height = vid.videoHeight;
        can.getContext('2d').drawImage(vid, 0, 0);
        pushMsg(`<img src="${can.toDataURL('image/png')}">`, 'sent');
        stopCam();
    }

    function stopCam() {
        document.getElementById('camOverlay').style.display = 'none';
        if (sObj) sObj.getTracks().forEach(t => t.stop());
    }

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const content = file.type.startsWith('image/') ? `<img src="${e.target.result}">` : `📎 ملف: ${file.name}`;
            pushMsg(content, 'sent');
        };
        reader.readAsDataURL(file);
    }

    function pushMsg(html, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = html;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    // دالة إنشاء ملف WAV (التي نجحت معك)
    function makeWav(samples, sRate) {
        const b = new ArrayBuffer(44 + samples.length * 2);
        const v = new DataView(b);
        const s = (v, o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
        s(v, 0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true);
        s(v, 8, 'WAVE'); s(v, 12, 'fmt '); v.setUint32(16, 16, true);
        v.setUint16(20, 1, true); v.setUint16(22, 1, true);
        v.setUint32(24, sRate, true); v.setUint32(28, sRate * 2, true);
        v.setUint16(32, 2, true); v.setUint16(34, 16, true);
        s(v, 36, 'data'); v.setUint32(40, samples.length * 2, true);
        let o = 44;
        for (let i = 0; i < samples.length; i++, o += 2) {
            let s = Math.max(-1, Math.min(1, samples[i]));
            v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([v], { type: 'audio/wav' });
    }
</script>
</body>
</html>
