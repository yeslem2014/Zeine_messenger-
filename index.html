<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام التواصل الاحترافي</title>
    <!-- استدعاء مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #efe7de; font-family: sans-serif; }
        
        /* الرأس */
        header { 
            position: absolute; top: 0; left: 0; right: 0; height: 55px;
            background: #075e54; color: white; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* منطقة الفيديو */
        #videoArea { 
            position: absolute; top: 55px; left: 0; right: 0; height: 250px;
            background: #000; display: none; z-index: 10; border-bottom: 2px solid #128c7e;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* منطقة الدردشة */
        #chat { 
            position: absolute; top: 55px; bottom: 70px; left: 0; right: 0;
            overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5;
            transition: top 0.3s ease-in-out;
        }

        /* الرسائل */
        .msg { background: #dcf8c6; padding: 10px; border-radius: 12px; align-self: flex-end; max-width: 85%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; border: 1px solid #ddd; display: block; }

        /* الشريط السفلي */
        .footer { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: #f0f0f0; display: flex; align-items: center; padding: 0 10px;
            border-top: 1px solid #ccc; z-index: 100; gap: 5px;
        }

        /* الأزرار */
        .btn { background: none; border: none; padding: 10px; color: #54656f; font-size: 22px; cursor: pointer; transition: 0.2s; outline: none; }
        .btn:active { transform: scale(0.9); }
        .active-red { color: #e74c3c !important; }
        .active-green { color: #128c7e !important; }

        /* حقل الإدخال */
        input { flex: 1; border: none; padding: 12px 15px; border-radius: 25px; font-size: 16px; outline: none; background: white; box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة</header>

    <div id="videoArea">
        <video id="v" autoplay playsinline muted></video> <!-- muted هنا للمساعدة في التشغيل التلقائي -->
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="chat"></div>

    <div class="footer">
        <button class="btn" id="tglCam" title="تبديل الكاميرا"><i class="fas fa-camera-rotate"></i></button>
        <button class="btn" id="tglVid" title="تشغيل الفيديو"><i class="fas fa-video"></i></button>
        <button class="btn" id="takePic" title="التقاط صورة"><i class="fas fa-camera"></i></button>
        <button class="btn" id="tglMic" title="الميكروفون"><i class="fas fa-microphone"></i></button>
        <input type="text" id="m" placeholder="اكتب رسالة..." enterkeyhint="send">
        <button class="btn" id="sendBtn"><i class="fas fa-paper-plane" style="color:#128c7e"></i></button>
    </div>

    <script>
        const v = document.getElementById('v'), chat = document.getElementById('chat'), m = document.getElementById('m');
        const vArea = document.getElementById('videoArea'), canvas = document.getElementById('canvas');
        const tglVid = document.getElementById('tglVid'), tglMic = document.getElementById('tglMic'), takePic = document.getElementById('takePic');

        let stream = null, isRear = true;

        // استرجاع المحادثة القديمة عند فتح الصفحة
        window.onload = () => {
            const savedChat = localStorage.getItem('chat_history');
            if (savedChat) {
                chat.innerHTML = savedChat;
                chat.scrollTop = chat.scrollHeight;
            }
        };

        async function startMedia() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }
            try {
                const constraints = {
                    video: { 
                        facingMode: isRear ? "environment" : "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                v.srcObject = stream;
                
                v.onloadedmetadata = () => {
                    v.play();
                    v.muted = false; // فك الكتم بعد التشغيل لضمان عمل الصوت في أندرويد
                };

                vArea.style.display = "block";
                chat.style.top = "305px";
                tglVid.classList.add('active-green');
                tglMic.classList.add('active-green');
                tglMic.classList.remove('active-red');
            } catch (e) {
                console.error("Media Access Error: ", e);
                alert("تنبيه: يرجى السماح للمتصفح بالوصول للكاميرا والميكروفون.");
            }
        }

        // تشغيل/إيقاف الفيديو
        tglVid.onclick = () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                vArea.style.display = "none";
                chat.style.top = "55px";
                tglVid.classList.remove('active-green');
                tglMic.classList.remove('active-green', 'active-red');
                stream = null;
            } else {
                startMedia();
            }
        };

        // تبديل الكاميرا
        document.getElementById('tglCam').onclick = () => { 
            isRear = !isRear; 
            if(stream) startMedia(); 
        };

        // كتم/تشغيل الميكروفون
        tglMic.onclick = () => {
            if (stream) {
                const audioTrack = stream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    tglMic.classList.toggle('active-red', !audioTrack.enabled);
                    tglMic.classList.toggle('active-green', audioTrack.enabled);
                    tglMic.querySelector('i').className = audioTrack.enabled ? 'fas fa-microphone' : 'fas fa-microphone-slash';
                }
            }
        };

        // التقاط الصورة
        takePic.onclick = () => {
            if (stream) {
                const context = canvas.getContext('2d');
                canvas.width = v.videoWidth;
                canvas.height = v.videoHeight;
                context.drawImage(v, 0, 0, canvas.width, canvas.height);
                const dataUrl = canvas.toDataURL('image/png');
                
                addMessage(`لقطة مباشرة:<br><img src="${dataUrl}">`);
            } else {
                alert("يجب تشغيل الكاميرا أولاً");
            }
        };

        // إرسال النص
        function send() {
            if (m.value.trim()) {
                addMessage(m.value);
                m.value = "";
            }
        }

        function addMessage(content) {
            const d = document.createElement('div');
            d.className = 'msg'; 
            d.innerHTML = content;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
            // حفظ المحادثة تلقائياً
            localStorage.setItem('chat_history', chat.innerHTML);
        }

        document.getElementById('sendBtn').onclick = send;
        m.onkeypress = (e) => { if(e.key === "Enter") send(); };
    </script>
</body>
</html>
