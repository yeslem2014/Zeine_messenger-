<div id="recordingsList" style="height: 300px; overflow-y: auto; padding: 10px;"></div>

<div style="text-align: center; margin-top: 20px;">
    <button id="recordButton" style="background: #006655; border: none; border-radius: 50%; width: 70px; height: 70px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
        <div id="recordIcon" style="width: 20px; height: 20px; background: white; border-radius: 50%;"></div>
    </button>
    <p id="status" style="color: #666; margin-top: 10px;">اضغط للبدء</p>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    const recordButton = document.getElementById('recordButton');
    const recordIcon = document.getElementById('recordIcon');
    const statusText = document.getElementById('status');
    const recordingsList = document.getElementById('recordingsList');

    recordButton.addEventListener('click', async () => {
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            startRecording();
        } else {
            stopRecording();
        }
    });

    async function startRecording() {
        audioChunks = [];
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                // دمج البيانات وتحويلها إلى ملف صوتي بعد التأكد من التوقف
                const audioBlob = new Blob(audioChunks, { type: 'audio/mpeg' });
                const audioUrl = URL.createObjectURL(audioBlob);
                displayAudio(audioUrl);
                
                // إغلاق الميكروفون نهائياً
                stream.getTracks().forEach(track => track.stop());
            };

            mediaRecorder.start();
            statusText.innerText = "جاري التسجيل...";
            recordButton.style.backgroundColor = "#ff4444";
            recordIcon.style.borderRadius = "4px"; // تغيير الشكل لمربع (إيقاف)
        } catch (err) {
            alert("يرجى تفعيل صلاحية الميكروفون");
        }
    }

    function stopRecording() {
        mediaRecorder.stop();
        statusText.innerText = "تم الحفظ";
        recordButton.style.backgroundColor = "#006655";
        recordIcon.style.borderRadius = "50%"; // العودة لشكل الدائرة
    }

    function displayAudio(url) {
        const div = document.createElement('div');
        div.style.cssText = "background: #dcf8c6; padding: 10px; border-radius: 10px; margin: 5px; text-align: right; float: right; clear: both; width: 80%;";
        
        const audio = document.createElement('audio');
        audio.src = url;
        audio.controls = true;
        audio.style.width = "100%";
        
        div.appendChild(audio);
        recordingsList.appendChild(div);
        recordingsList.scrollTop = recordingsList.scrollHeight;
    }
</script>
