<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mic Test Only</title>
    <style>
        /* إخفاء كل شيء ومنع التمرير */
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background: #000; 
            display: flex; align-items: center; justify-content: center;
            font-family: sans-serif;
        }

        /* زر الميكروفون العملاق */
        #mainBtn {
            width: 250px; height: 250px; border-radius: 50%;
            background: #333; border: 10px solid #444;
            display: flex; align-items: center; justify-content: center;
            font-size: 100px; cursor: pointer; transition: 0.4s;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* حالة التشغيل */
        .active { background: #1b5e20 !important; border-color: #25d366 !important; box-shadow: 0 0 40px #25d366 !important; }
        /* حالة الكتم */
        .muted { background: #b71c1c !important; border-color: #f44336 !important; box-shadow: 0 0 40px #f44336 !important; }

        #info {
            position: absolute; bottom: 10%; color: white;
            font-size: 20px; text-align: center; width: 100%;
        }
    </style>
</head>
<body>

    <div id="mainBtn">🎤</div>
    <div id="info">اضغط لتشغيل الميكروفون</div>

    <audio id="player" autoplay></audio>

    <script>
        const btn = document.getElementById('mainBtn');
        const info = document.getElementById('info');
        const player = document.getElementById('player');
        let stream = null;

        btn.onclick = async () => {
            // المرحلة الأولى: طلب الصلاحية والبدء
            if (!stream) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    player.srcObject = stream; // تسمع صوتك في السماعة
                    btn.classList.add('active');
                    info.innerText = "الميكروفون يعمل - تحدث الآن";
                } catch (err) {
                    info.innerText = "خطأ: تأكد من إعطاء صلاحية الميكروفون";
                }
                return;
            }

            // المرحلة الثانية: الكتم والتشغيل
            const track = stream.getAudioTracks()[0];
            track.enabled = !track.enabled;

            if (track.enabled) {
                btn.className = "active";
                btn.innerText = "🎤";
                info.innerText = "الميكروفون يعمل";
            } else {
                btn.className = "muted";
                btn.innerText = "🔇";
                info.innerText = "تم كتم الصوت";
            }
        };
    </script>
</body>
</html>
