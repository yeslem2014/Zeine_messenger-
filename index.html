<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام التواصل الاحترافي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        
        /* منطقة التحكم بالأجهزة */
        #controls { background: #fff; padding: 10px; display: flex; gap: 5px; flex-wrap: wrap; border-bottom: 1px solid #ccc; font-size: 12px; }
        select { flex: 1; padding: 5px; border-radius: 5px; border: 1px solid #ccc; }

        #videoArea { width: 100%; display: none; background: #000; }
        video { width: 100%; height: 280px; object-fit: cover; }

        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #dcf8c6; padding: 10px; border-radius: 15px; align-self: flex-end; max-width: 80%; }

        .input-bar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ccc; }
        button { background: #128c7e; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; outline: none; }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة</header>

    <div id="controls">
        <select id="videoSource" title="اختر الكاميرا"></select>
        <select id="audioSource" title="اختر الميكروفون"></select>
        <button id="btnStart">تشغيل</button>
    </div>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="اكتب رسالة...">
        <button id="btnSend"><i class="fas fa-paper-plane"></i></button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const videoSelect = document.getElementById('videoSource');
        const audioSelect = document.getElementById('audioSource');
        const btnStart = document.getElementById('btnStart');
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');

        // جلب الأجهزة المتاحة (كاميرات وميكروفونات)
        async function getDevices() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                if (device.kind === 'videoinput') {
                    option.text = device.label || `كاميرا ${videoSelect.length + 1}`;
                    videoSelect.appendChild(option);
                } else if (device.kind === 'audioinput') {
                    option.text = device.label || `ميكروفون ${audioSelect.length + 1}`;
                    audioSelect.appendChild(option);
                }
            });
        }

        async function startStream() {
            if (window.stream) {
                window.stream.getTracks().forEach(track => track.stop());
            }
            const constraints = {
                audio: { deviceId: audioSelect.value ? { exact: audioSelect.value } : undefined },
                video: { deviceId: videoSelect.value ? { exact: videoSelect.value } : undefined }
            };
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                window.stream = stream;
                videoElement.srcObject = stream;
                document.getElementById('videoArea').style.display = "block";
                btnStart.innerText = "تحديث";
            } catch (e) {
                alert("خطأ: " + e.message);
            }
        }

        btnStart.onclick = startStream;

        // تفعيل طلب الأذونات أولاً لجلب أسماء الأجهزة
        navigator.mediaDevices.getUserMedia({ audio: true, video: true })
            .then(s => {
                s.getTracks().forEach(t => t.stop());
                getDevices();
            });

        document.getElementById('btnSend').onclick = () => {
            if (userInput.value.trim()) {
                const div = document.createElement('div');
                div.className = 'msg';
                div.textContent = userInput.value;
                chat.appendChild(div);
                userInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        };
    </script>
</body>
</html>
