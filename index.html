<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #status { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #videoArea { width: 100%; display: none; background: #000; position: relative; }
        video { width: 100%; height: auto; border-bottom: 4px solid #128c7e; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; padding-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        i { color: #51585c; font-size: 26px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status">نظام العائلة - متصل</div>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="chat" id="messages"></div>

    <div class="input-bar">
        <i class="fas fa-camera" id="btnCam"></i>
        <i class="fas fa-microphone" id="btnMic"></i>
        <input type="text" id="userInput" placeholder="اكتب رسالة...">
        <i class="fas fa-paper-plane" style="color:#128c7e" id="btnSend"></i>
    </div>

    <script>
        const btnCam = document.getElementById('btnCam');
        const videoArea = document.getElementById('videoArea');
        const webcam = document.getElementById('webcam');

        // تشغيل الكاميرا الأمامية فوراً
        btnCam.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" },
                    audio: false 
                });
                webcam.srcObject = stream;
                videoArea.style.display = "block";
                // أمر تشغيل إجباري لكسر الدائرة المتكررة
                webcam.play().catch(e => console.log("Video play failed"));
            } catch (err) {
                alert("يرجى الضغط على 'سماح' في المتصفح لتفعيل الكاميرا");
            }
        };

        // تفعيل زر الإرسال
        document.getElementById('btnSend').onclick = () => {
            const input = document.getElementById('userInput');
            if(input.value) {
                const msg = document.createElement('div');
                msg.textContent = input.value;
                msg.style.cssText = "background:#dcf8c6; padding:10px; border-radius:15px; align-self:flex-end; max-width:80%;";
                document.getElementById('chat').appendChild(msg);
                input.value = "";
            }
        };
    </script>
</body>
</html>
