<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>اصلاح الصوت الجذري - Zeine</title>
    <style>
        body { margin: 0; background: #e5ddd5; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { background: #dcf8c6; padding: 8px; border-radius: 12px; align-self: flex-end; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 5px; }
        .msg audio { max-width: 260px; height: 40px; }
        .msg-title { font-size: 11px; color: #075e54; font-weight: bold; }
        .msg-time { font-size: 10px; color: #777; align-self: flex-end; }

        .footer { height: 140px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 1px solid #ccc; }
        #mic { width: 75px; height: 75px; border-radius: 50%; border: none; background: #075e54; color: white; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; }
        
        .recording { background: #ff4d4d !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 8px; font-size: 13px; color: #555; font-weight: bold; }
    </style>
    
    <!-- جلب مكتبة RecordRTC لحل مشاكل تشغيل الصوت على الهواتف -->
    <script src="cloudflare.com"></script>
</head>
<body>

<header>نظام تواصل العائلة - Zeine</header>
<div id="chat"></div>

<div class="footer">
    <button id="mic">🎤</button>
    <div id="status">انقر على الميكروفون للتسجيل</div>
</div>

<script>
    const micBtn = document.getElementById('mic');
    const chatBox = document.getElementById('chat');
    const statusTxt = document.getElementById('status');

    let recorder = null;
    let microphoneStream = null;

    micBtn.onclick = async () => {
        // حالة بدء التسجيل الجديد
        if (!recorder || recorder.getState() === "inactive") {
            try {
                // طلب صلاحية الميكروفون بأعلى إعدادات نقاء
                microphoneStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                
                // تهيئة مكتبة RecordRTC لتسجيل ملف صوتي بصيغة WAV ستيريو متوافقة عالمياً
                recorder = new RecordRTC(microphoneStream, {
                    type: 'audio',
                    mimeType: 'audio/wav',
                    numberOfAudioChannels: 2,
                    checkForInactiveTracks: true
                });

                // بدء عملية التسجيل
                recorder.startRecording();
                
                // تحديث واجهة المستخدم
                micBtn.classList.add('recording');
                micBtn.innerText = "🛑";
                statusTxt.innerText = "جاري التسجيل الآن... انقر للإرسال";

            } catch (err) {
                console.error("خطأ في الميكروفون:", err);
                alert("يرجى تفعيل صلاحية الميكروفون من إعدادات المتصفح.");
            }
        } 
        // حالة إيقاف التسجيل وتوليد الملف الصوتي
        else {
            recorder.stopRecording(() => {
                // الحصول على الرابط المباشر للملف الصوتي المولد والمحفوظ بالكامل
                const audioUrl = recorder.toURL();
                
                const now = new Date();
                const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                // بناء فقاعة الدردشة وعنصر الصوت
                const div = document.createElement('div');
                div.className = 'msg';
                
                const audioEl = document.createElement('audio');
                audioEl.src = audioUrl;
                audioEl.controls = true;
                
                div.innerHTML = `<span class="msg-title">رسالة صوتية</span>`;
                div.appendChild(audioEl);
                div.innerHTML += `<span class="msg-time">${timeStr}</span>`;
                
                chatBox.appendChild(div);
                chatBox.scrollTop = chatBox.scrollHeight; 

                // تحرير وإغلاق الميكروفون بالكامل بعد انتهاء التسجيل
                if (microphoneStream) {
                    microphoneStream.getTracks().forEach(track => track.stop());
                }
            });

            // إعادة تعيين واجهة المستخدم وشكل الزر
            micBtn.classList.remove('recording');
            micBtn.innerText = "🎤";
            statusTxt.innerText = "تم الإرسال! انقر للتسجيل مجدداً";
        }
    };
</script>

</body>
</html>
