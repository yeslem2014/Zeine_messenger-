<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الميكروفون فقط</title>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #121212; color: white; font-family: sans-serif;
        }
        #micBtn {
            width: 200px; height: 200px; border-radius: 50%;
            background: #333; border: 8px solid #555;
            font-size: 80px; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .active { background: #25d366 !important; border-color: #dcf8c6 !important; box-shadow: 0 0 30px #25d366; }
        .muted { background: #f44336 !important; border-color: #ffcdd2 !important; }
        #status { margin-top: 20px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="micBtn">🎤</div>
    <div id="status">اضغط على الميكروفون للبدء</div>

    <audio id="playback" autoplay></audio>

    <script>
        const btn = document.getElementById('micBtn');
        const status = document.getElementById('status');
        const playback = document.getElementById('playback');
        let stream = null;

        btn.onclick = async () => {
            if (!stream) {
                // تفعيل الميكروفون لأول مرة
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    playback.srcObject = stream;
                    btn.classList.add('active');
                    status.innerText = "الميكروفون يعمل.. تحدث الآن";
                } catch (err) {
                    alert("يجب إعطاء صلاحية الميكروفون من المتصفح");
                }
            } else {
                // تبديل حالة الميكروفون (كتم / تشغيل)
                const track = stream.getAudioTracks()[0];
                track.enabled = !track.enabled;
                
                if (track.enabled) {
                    btn.classList.remove('muted');
                    btn.classList.add('active');
                    btn.innerText = "🎤";
                    status.innerText = "الميكروفون يعمل";
                } else {
                    btn.classList.remove('active');
                    btn.classList.add('muted');
                    btn.innerText = "🔇";
                    status.innerText = "تم كتم الصوت";
                }
            }
        };
    </script>
</body>
</html>
