<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فحص الميكروفون فقط</title>
    <style>
        body { 
            margin: 0; height: 100vh; display: flex; align-items: center; 
            justify-content: center; background: #222; font-family: sans-serif;
        }

        /* حاوية الميكروفون المركزية */
        .mic-container { text-align: center; color: white; }

        .mic-circle {
            width: 150px; height: 150px; border-radius: 50%;
            background: #444; display: flex; align-items: center;
            justify-content: center; font-size: 60px; margin-bottom: 20px;
            cursor: pointer; transition: 0.3s; border: 5px solid transparent;
        }

        /* حالات الألوان */
        .ready { border-color: #25d366; background: #075e54; box-shadow: 0 0 20px #25d366; }
        .muted { border-color: #f44336; background: #b71c1c; box-shadow: 0 0 20px #f44336; }

        .status-text { font-size: 18px; margin-top: 10px; }
        button { 
            padding: 12px 25px; border-radius: 25px; border: none; 
            background: #25d366; color: white; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="mic-container">
        <div id="micBtn" class="mic-circle" style="display:none;">🎤</div>
        <button id="startBtn">اضغط لتشغيل الميكروفون</button>
        <div id="status" class="status-text">الميكروفون مغلق</div>
    </div>

    <audio id="echo" autoplay></audio>

    <script>
        const micBtn = document.getElementById('micBtn');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const echo = document.getElementById('echo');

        let stream = null;

        startBtn.onclick = async () => {
            try {
                // طلب الميكروفون فقط بدقة
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // جعل الصوت يخرج من السماعة لتتأكد بنفسك
                echo.srcObject = stream;

                startBtn.style.display = 'none';
                micBtn.style.display = 'flex';
                micBtn.classList.add('ready');
                status.innerText = "الميكروفون يعمل (تحدث الآن)";
            } catch (err) {
                status.innerText = "خطأ: لم تسمح بالوصول للميكروفون";
            }
        };

        micBtn.onclick = () => {
            if (stream) {
                const track = stream.getAudioTracks()[0];
                track.enabled = !track.enabled;

                if (track.enabled) {
                    micBtn.className = "mic-circle ready";
                    micBtn.innerText = "🎤";
                    status.innerText = "الميكروفون يعمل";
                } else {
                    micBtn.className = "mic-circle muted";
                    micBtn.innerText = "🔇";
                    status.innerText = "تم كتم الميكروفون";
                }
            }
        };
    </script>
</body>
</html>
