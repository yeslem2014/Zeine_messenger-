<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 1.2em; }
        #recordingsList { flex: 1; overflow-y: auto; padding: 15px; }
        .audio-card { background: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid #25d366; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .controls { padding: 25px; background: #fff; text-align: center; border-top: 1px solid #ddd; }
        #micBtn { width: 70px; height: 70px; border-radius: 50%; border: none; background: #075e54; color: white; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .recording { background: #e74c3c !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="header">نظام Zeine - نسخة سامسونج</div>
<div id="recordingsList"></div>

<div class="controls">
    <button id="micBtn">🎤</button>
    <p id="status">اضغط للتحدث</p>
</div>

<script>
    let mediaRecorder;
    let chunks = [];

    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    const list = document.getElementById('recordingsList');

    micBtn.onclick = async () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // في سامسونج، نستخدم الصيغة الأساسية لضمان التقاط البيانات
            mediaRecorder = new MediaRecorder(stream);
            chunks = [];

            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/ogg; codecs=opus' });
                const url = URL.createObjectURL(blob);
                
                // إنشاء البطاقة
                const card = document.createElement('div');
                card.className = 'audio-card';
                card.innerHTML = `
                    <audio src="${url}" controls style="width: 100%;"></audio>
                    <div style="margin-top:5px; font-size:12px; color:#888;">تم التسجيل بنجاح ✅</div>
                `;
                list.appendChild(card);
                list.scrollTop = list.scrollHeight;

                // إغلاق الميكروفون
                stream.getTracks().forEach(t => t.stop());
                updateUI(false);
            };

            mediaRecorder.start();
            updateUI(true);

        } catch (err) {
            alert("تأكد من إعطاء صلاحية الميكروفون للمتصفح في إعدادات سامسونج");
        }
    };

    function updateUI(isRecording) {
        if (isRecording) {
            micBtn.classList.add('recording');
            micBtn.innerHTML = "⏹️";
            status.innerText = "جاري التسجيل... انقر للإيقاف";
        } else {
            micBtn.classList.remove('recording');
            micBtn.innerHTML = "🎤";
            status.innerText = "اضغط للتحدث مرة أخرى";
        }
    }
</script>

</body>
</html>
