<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام Zeine الاحترافي</title>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 25px; text-align: center; font-size: 24px; font-weight: bold; }
        
        /* جعل منطقة الرسائل واسعة وواضحة */
        #displayList { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        .audio-item { 
            background: white; padding: 20px; border-radius: 15px; 
            width: 90%; align-self: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border-right: 10px solid #25d366;
        }

        audio { width: 100%; height: 60px; } /* حجم ضخم لسهولة النقر */

        /* لوحة التحكم السفلية */
        .bottom-panel { background: #f0f0f0; padding: 40px; text-align: center; border-top: 2px solid #ccc; }
        
        #actionBtn { 
            width: 110px; height: 110px; border-radius: 50%; border: none; 
            background: #075e54; color: white; font-size: 45px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); transition: 0.2s;
        }

        .is-recording { background: #cc0000 !important; transform: scale(1.1); }
        
        #statusInfo { margin-top: 20px; font-size: 20px; color: #000; font-weight: 600; }
    </style>
</head>
<body>

<div class="header">نظام Zeine الصوتي</div>

<div id="displayList"></div>

<div class="bottom-panel">
    <button id="actionBtn">🎤</button>
    <div id="statusInfo">اضغط للتحدث</div>
</div>

<script>
    let recorder;
    let chunks = [];
    let audioStream;

    const btn = document.getElementById('actionBtn');
    const info = document.getElementById('statusInfo');
    const list = document.getElementById('displayList');

    btn.onclick = async () => {
        if (recorder && recorder.state === "recording") {
            recorder.stop();
            audioStream.getTracks().forEach(t => t.stop());
            btn.classList.remove('is-recording');
            btn.innerHTML = "🎤";
            info.innerText = "تم الحفظ بنجاح ✅";
            return;
        }

        try {
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // استخدام التنسيق الأكثر استقراراً لنظام أندرويد
            const options = { mimeType: 'audio/webm;codecs=opus' };
            recorder = new MediaRecorder(audioStream, options);
            chunks = [];

            recorder.ondataavailable = e => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
                // تحويل مصفوفة البيانات إلى ملف صوتي حقيقي
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                
                const div = document.createElement('div');
                div.className = 'audio-item';
                div.innerHTML = `<audio src="${url}" controls></audio>`;
                
                list.appendChild(div);
                list.scrollTop = list.scrollHeight;
            };

            recorder.start(1000); // إجبار المتصفح على جمع البيانات كل ثانية لضمان عدم الضياع
            btn.classList.add('is-recording');
            btn.innerHTML = "⏹️";
            info.innerText = "جاري التسجيل... انقر للإيقاف";

        } catch (err) {
            alert("خطأ: يرجى تفعيل إذن الميكروفون في إعدادات كروم على هاتفك.");
        }
    };
</script>

</body>
</html>
