<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --whatsapp-green: #075e54; --light-green: #dcf8c6; --bg-color: #efe7de; }
        
        body { font-family: sans-serif; background: var(--bg-color); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* ضبط شريط الحالة العلوي */
        #status { background: var(--whatsapp-green); color: white; padding: 12px; text-align: center; font-weight: bold; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* منطقة البث المباشر */
        #videoArea { width: 100%; display: none; background: #000; border-bottom: 2px solid #128c7e; }
        video { width: 100%; height: auto; max-height: 35vh; object-fit: cover; }

        /* منطقة المحادثة */
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 90px; }
        .msg { background: var(--light-green); padding: 10px 15px; border-radius: 15px; align-self: flex-end; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); font-size: 16px; }
        .img-msg { align-self: flex-end; max-width: 70%; border-radius: 10px; overflow: hidden; border: 2px solid white; box-shadow: 0 1px 5px rgba(0,0,0,0.2); }
        .img-msg img { width: 100%; display: block; }

        /* شريط الإدخال السفلي الثابت */
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #ccc; z-index: 1000; padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; }
        i { color: #51585c; font-size: 24px; cursor: pointer; padding: 5px; }
        .active-icon { color: #128c7e !important; }
    </style>
</head>
<body>

    <div id="status">نظام العائلة - متصل</div>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <i class="fas fa-video" id="btnStream" title="بث مباشر"></i>
        <i class="fas fa-camera" id="btnCapture" title="التقاط صورة"></i>
        <i class="fas fa-microphone" id="btnMic" title="ميكروفون"></i>
        <input type="text" id="userInput" placeholder="اكتب رسالة...">
        <i class="fas fa-paper-plane active-icon" id="btnSend"></i>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const btnStream = document.getElementById('btnStream');
        const btnCapture = document.getElementById('btnCapture');
        const btnMic = document.getElementById('btnMic');
        const videoArea = document.getElementById('videoArea');
        const webcam = document.getElementById('webcam');
        const chat = document.getElementById('chat');
        const canvas = document.getElementById('canvas');
        const userInput = document.getElementById('userInput');

        // 1. تشغيل/إغلاق البث المباشر
        btnStream.onclick = async () => {
            if (videoArea.style.display === "block") {
                videoArea.style.display = "none";
                if (webcam.srcObject) {
                    webcam.srcObject.getTracks().forEach(t => t.stop());
                }
                btnStream.classList.remove('active-icon');
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                    webcam.srcObject = stream;
                    videoArea.style.display = "block";
                    btnStream.classList.add('active-icon');
                } catch (e) { alert("يرجى تفعيل إذن الكاميرا من الإعدادات"); }
            }
        };

        // 2. التقاط صورة من البث وإرسالها
        btnCapture.onclick = () => {
            if (webcam.srcObject && videoArea.style.display === "block") {
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;
                canvas.getContext('2d').drawImage(webcam, 0, 0);
                const imageData = canvas.toDataURL('image/png');
                
                const div = document.createElement('div');
                div.className = 'img-msg';
                div.innerHTML = `<img src="${imageData}">`;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            } else {
                alert("يجب فتح البث المباشر أولاً لالتقاط صورة");
            }
        };

        // 3. تفعيل الميكروفون
        btnMic.onclick = async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                btnMic.classList.add('active-icon');
                alert("الميكروفون نشط الآن");
            } catch (e) { alert("يرجى تفعيل إذن الميكروفون"); }
        };

        // 4. إرسال النص
        document.getElementById('btnSend').onclick = () => {
            if (userInput.value.trim() !== "") {
                const div = document.createElement('div');
                div.className = 'msg';
                div.textContent = userInput.value;
                chat.appendChild(div);
                userInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        };
    </script>
</body>
</html>
