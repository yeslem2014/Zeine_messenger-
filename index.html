<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Zeine - الإصلاح النهائي للمسجل</title>
    <style>
        body { margin: 0; background: #e5ddd5; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #dcf8c6; padding: 10px; border-radius: 12px; align-self: flex-end; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .footer { height: 140px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 1px solid #ccc; }
        #mic { width: 75px; height: 75px; border-radius: 50%; border: none; background: #075e54; color: white; font-size: 30px; cursor: pointer; }
        .recording { background: #ff4d4d !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 8px; font-size: 13px; color: #555; }
    </style>
</head>
<body>

<header>نظام Zeine العائلي</header>
<div id="chat"></div>

<div class="footer">
    <button id="mic">🎤</button>
    <div id="status">اضغط للتحدث (جملة طويلة للتجربة)</div>
</div>

<script>
    const micBtn = document.getElementById('mic');
    const chatBox = document.getElementById('chat');
    const statusTxt = document.getElementById('status');

    let audioContext;
    let recorder;
    let stream;

    micBtn.onclick = async () => {
        if (!recorder || recorder.state === "inactive") {
            try {
                // 1. طلب الوصول للميكروفون
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                
                // 2. استخدام معالج التسجيل الأساسي
                const mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    // 3. التأكد من تحويل البيانات لملف صوتي صالح
                    const blob = new Blob(chunks, { type: 'audio/mp3' }); // تغيير الصيغة لـ MP3 للتوافق
                    const url = URL.createObjectURL(blob);
                    
                    const div = document.createElement('div');
                    div.className = 'msg';
                    div.innerHTML = `<audio src="${url}" controls></audio>`;
                    chatBox.appendChild(div);
                    chatBox.scrollTop = chatBox.scrollHeight;

                    // إغلاق الميكروفون تماماً
                    stream.getTracks().forEach(track => track.stop());
                };

                // بدء التسجيل فعلياً
                mediaRecorder.start();
                recorder = mediaRecorder;
                
                micBtn.classList.add('recording');
                micBtn.innerText = "🛑";
                statusTxt.innerText = "جاري التسجيل... صوتك يُحفظ الآن";

            } catch (err) {
                alert("يرجى السماح بالوصول للميكروفون في إعدادات المتصفح.");
            }
        } else {
            // إيقاف التسجيل ومعالجة البيانات
            recorder.stop();
            micBtn.classList.remove('recording');
            micBtn.innerText = "🎤";
            statusTxt.innerText = "تم الإرسال! انتظر ظهور المشغل";
        }
    };
</script>

</body>
</html>
