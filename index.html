<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام التواصل الاحترافي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --whatsapp-green: #075e54; --bg-color: #efe7de; }
        body { font-family: sans-serif; background: var(--bg-color); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--whatsapp-green); color: white; padding: 15px; text-align: center; font-weight: bold; }
        #videoArea { width: 100%; display: none; background: #000; position: relative; }
        video { width: 100%; height: 280px; object-fit: cover; border-bottom: 3px solid #128c7e; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 85px; }
        .msg { background: #dcf8c6; padding: 10px; border-radius: 10px; align-self: flex-end; max-width: 80%; }
        .input-bar { position: fixed; bottom: 0; width: 100%; background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 8px; box-sizing: border-box; border-top: 1px solid #ccc; z-index: 1000; }
        button { background: none; border: none; padding: 8px; cursor: pointer; color: #51585c; outline: none; }
        .active { color: #128c7e !important; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة</header>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <button id="btnSwitch"><i class="fas fa-sync"></i></button>
        <button id="btnStream"><i class="fas fa-video"></i></button>
        <button id="btnMic"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="اكتب رسالة...">
        <button id="btnSend"><i class="fas fa-paper-plane" style="color:#128c7e"></i></button>
    </div>

    <script>
        const btnStream = document.getElementById('btnStream'), btnSwitch = document.getElementById('btnSwitch'), btnMic = document.getElementById('btnMic');
        const webcam = document.getElementById('webcam'), videoArea = document.getElementById('videoArea'), chat = document.getElementById('chat'), userInput = document.getElementById('userInput');
        
        let currentStream = null;
        let isRear = false;

        async function startMedia() {
            // إنهاء أي بث سابق
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { 
                    facingMode: isRear ? { exact: "environment" } : "user",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                webcam.srcObject = currentStream;
                videoArea.style.display = "block";
                btnStream.classList.add('active');
                btnMic.classList.add('active');
                
                // تفعيل الصوت برمجياً لضمان عدم وجود كتم (Mute) من النظام
                webcam.muted = false; 
                console.log("تم تشغيل الوسائط بنجاح");
            } catch (err) {
                console.error("فشل الوصول:", err);
                // محاولة تشغيل الكاميرا الخلفية بدون شرط 'exact' إذا فشلت
                if (isRear) {
                    isRear = false;
                    alert("الكاميرا الخلفية غير مدعومة أو محظورة، سيتم تشغيل المتاحة.");
                    startMedia();
                } else {
                    alert("تأكد من إعطاء صلاحية الميكروفون والكاميرا للمتصفح.");
                }
            }
        }

        btnStream.onclick = () => {
            if (currentStream && currentStream.getVideoTracks().length > 0) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
                videoArea.style.display = "none";
                btnStream.classList.remove('active');
                btnMic.classList.remove('active');
            } else {
                startMedia();
            }
        };

        btnSwitch.onclick = () => {
            isRear = !isRear;
            if (currentStream) startMedia();
        };

        btnMic.onclick = () => {
            if (currentStream) {
                const audioTrack = currentStream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    btnMic.classList.toggle('active', audioTrack.enabled);
                }
            } else {
                startMedia();
            }
        };

        function send() {
            if (userInput.value.trim()) {
                const div = document.createElement('div');
                div.className = 'msg';
                div.textContent = userInput.value;
                chat.appendChild(div);
                userInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }
        document.getElementById('btnSend').onclick = send;
        userInput.onkeypress = (e) => { if(e.key === "Enter") send(); };
    </script>
</body>
</html>
