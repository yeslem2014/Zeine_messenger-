<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام التواصل - الإصدار المباشر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #075e54; color: white; padding: 12px; text-align: center; font-size: 14px; }
        
        #videoContainer { width: 100%; display: none; background: #000; height: 250px; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #chat { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .msg { background: #dcf8c6; padding: 8px 12px; border-radius: 12px; align-self: flex-end; max-width: 85%; font-size: 15px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .img-msg { background: white; padding: 4px; border-radius: 8px; align-self: flex-end; }
        .img-msg img { max-width: 200px; border-radius: 5px; display: block; }

        .footer { background: #f0f0f0; padding: 8px; display: flex; align-items: center; gap: 5px; border-top: 1px solid #ddd; }
        .icon-btn { background: none; border: none; padding: 10px; color: #54656f; cursor: pointer; font-size: 22px; transition: 0.2s; }
        .active-icon { color: #00a884; }
        input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #fff; outline: none; font-size: 15px; }
        #sendBtn { color: #00a884; font-size: 24px; }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة - متصل</header>

    <div id="videoContainer">
        <video id="v" autoplay playsinline muted></video>
    </div>

    <div id="chat"></div>

    <div class="footer">
        <button class="icon-btn" id="tglCam" title="كاميرا خلفية/أمامية"><i class="fas fa-sync-alt"></i></button>
        <button class="icon-btn" id="tglVid" title="بث فيديو"><i class="fas fa-video"></i></button>
        <button class="icon-btn" id="snap" title="التقاط صورة"><i class="fas fa-camera"></i></button>
        <button class="icon-btn" id="tglMic" title="ميكروفون"><i class="fas fa-microphone"></i></button>
        <input type="text" id="m" placeholder="اكتب رسالة...">
        <button class="icon-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
    </div>

    <canvas id="c" style="display:none;"></canvas>

    <script>
        const v = document.getElementById('v'), chat = document.getElementById('chat'), m = document.getElementById('m');
        let stream = null, isRear = true;

        async function init(rear) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            
            // محاولة إجبار النظام على الكاميرا الخلفية والميكروفون معاً
            const constraints = {
                video: { facingMode: rear ? { exact: "environment" } : "user" },
                audio: { 
                    echoCancellation: true, 
                    noiseSuppression: true 
                }
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                v.srcObject = stream;
                v.muted = false; // فك الكتم الإجباري
                document.getElementById('videoContainer').style.display = "block";
                document.getElementById('tglVid').classList.add('active-icon');
                document.getElementById('tglMic').classList.add('active-icon');
            } catch (e) {
                // إذا فشل الطلب الإجباري للخلفية، جرب الطلب العادي
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: rear ? "environment" : "user" }, audio: true });
                    v.srcObject = stream;
                    document.getElementById('videoContainer').style.display = "block";
                } catch (err) {
                    alert("يرجى تفعيل الصلاحيات من إعدادات المتصفح");
                }
            }
        }

        document.getElementById('tglVid').onclick = () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                document.getElementById('videoContainer').style.display = "none";
                document.getElementById('tglVid').classList.remove('active-icon');
            } else {
                init(isRear);
            }
        };

        document.getElementById('tglCam').onclick = () => {
            isRear = !isRear;
            init(isRear);
        };

        document.getElementById('tglMic').onclick = () => {
            if (stream) {
                const at = stream.getAudioTracks()[0];
                at.enabled = !at.enabled;
                document.getElementById('tglMic').classList.toggle('active-icon', at.enabled);
            }
        };

        document.getElementById('snap').onclick = () => {
            if (!stream) return;
            const c = document.getElementById('c');
            c.width = v.videoWidth; c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            const d = document.createElement('div');
            d.className = 'img-msg';
            d.innerHTML = `<img src="${c.toDataURL('image/jpeg')}">`;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        };

        function send() {
            if (m.value.trim()) {
                const d = document.createElement('div');
                d.className = 'msg';
                d.textContent = m.value;
                chat.appendChild(d);
                m.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }
        document.getElementById('sendBtn').onclick = send;
        m.onkeypress = (e) => { if(e.key === "Enter") send(); };
    </script>
</body>
</html>
