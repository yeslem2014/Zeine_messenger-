<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #128c7e; --bg: #efe7de; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #status { background: #075e54; color: white; padding: 12px; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .input-area { background: #f0f0f0; padding: 15px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
        .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        .input-area i { color: #51585c; font-size: 22px; cursor: pointer; }
        .send-btn { color: var(--primary) !important; }
    </style>
</head>
<body>
    <div id="status">جاري الاتصال بالنظام...</div>
    <div id="messages"></div>
    <div style="height: 70px;"></div> <div class="input-area">
        <i class="fas fa-paperclip"></i>
        <input type="text" id="messageInput" placeholder="اكتب رسالة...">
        <i class="fas fa-microphone" id="voiceBtn"></i>
        <i class="fas fa-camera" id="cameraBtn"></i>
        <i class="fas fa-paper-plane send-btn" id="sendBtn"></i>
    </div>
    <script src="script.js"></script>
</body>
</html>
