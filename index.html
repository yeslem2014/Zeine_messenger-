<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeine Messenger</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #008080;
            font-family: Arial, sans-serif;
            color: white;
        }
        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        .icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .icons i {
            font-size: 80px;
        }
        .user-icon { color: #3498db; }
        .shield-icon { color: #bdc3c7; }

        h1 { margin: 10px 0; font-size: 32px; }
        p { margin-bottom: 30px; font-size: 18px; opacity: 0.8; }

        input {
            width: 50%;
            padding: 15px;
            margin-bottom: 30px;
            border: none;
            border-radius: 30px;
            text-align: center;
            font-size: 18px;
            box-sizing: border-box;
        }
        button {
            width: 50%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background-color: #2ecc71;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #27ae60; }
        
        .error-msg {
            margin-top: 20px;
            color: #ffaa66;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icons">
            <i class="fas fa-user-circle user-icon"></i>
            <i class="fas fa-shield-alt shield-icon"></i>
        </div>
        
        <h1>Zeine_messenger</h1>
        <p>Owner Code</p>

        <input type="password" id="ownerCode" placeholder="......">

        <button onclick="checkCode()">Login</button>
        
        <div id="errorMsg" class="error-msg"></div>
    </div>

    <script>
        const OWNER_CODE = "Y3745@";
        const ROOM_CODES = {
            "1111": "general",
            "2222": "family",
            "3333": "friends",
            "4444": "private"
        };
        
        function checkCode() {
            const code = document.getElementById('ownerCode').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            
            if (!code) {
                errorDiv.innerHTML = '⚠️ الرجاء إدخال الكود';
                return;
            }
            
            // المالك
            if (code === OWNER_CODE) {
                localStorage.setItem('zeine_user_type', 'owner');
                localStorage.setItem('zeine_user_name', 'zeine');
                window.location.href = 'inbox.html';
                return;
            }
            
            // مستخدم عادي
            if (ROOM_CODES[code]) {
                let userName = prompt("✨ أدخل اسمك:");
                if (!userName || userName.trim() === "") {
                    errorDiv.innerHTML = '⚠️ الرجاء إدخال اسم صحيح';
                    return;
                }
                if (userName.trim().toLowerCase() === "zeine") {
                    errorDiv.innerHTML = '👑 هذا الاسم محجوز للمالك';
                    return;
                }
                localStorage.setItem('zeine_user_type', 'normal');
                localStorage.setItem('zeine_user_name', userName.trim());
                localStorage.setItem('zeine_user_room', ROOM_CODES[code]);
                window.location.href = 'inbox.html';
                return;
            }
            
            errorDiv.innerHTML = '❌ الكود غير صحيح';
            document.getElementById('ownerCode').value = '';
        }
        
        document.getElementById('ownerCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkCode();
        });
    </script>
</body>
</html>
