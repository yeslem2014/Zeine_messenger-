<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #128c7e; --bg: #efe7de; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* شريط العنوان */
        #status { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        
        /* منطقة الرسائل */
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 80px; }
        
        /* شريط الإدخال السفلي */
        .input-area { 
            background: #f0f0f0; 
            padding: 10px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            box-sizing: border-box; 
            border-top: 1px solid #ddd;
            z-index: 100;
        }
        
        .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; font-size: 16px; }
        .input-area i { color: #51585c; font-size: 24px; cursor: pointer; }
        .send-btn { color: var(--primary) !important; }

        /* تنسيق فقاعة الرسائل */
        .msg-bubble { background: #dcf8c6; padding: 8px 15px; border-radius: 15px; align-self: flex-end; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div id="status">نظام تواصل العائلة - متصل</div>

    <div id="messages" id="chatBox">
        </div>

    <div class="input-area">
        <i class="fas fa-camera" id="camBtn"></i>
        <i class="fas fa-microphone" id="micBtn"></i>
        <input type="text" id="userInput" placeholder="اكتب رسالة...">
        <i class="fas fa-paper-plane send-btn" id="sendBtn"></i>
    </div>

    <script>
        // كل البرمجة في مكان واحد
        const sendBtn = document.getElementById('sendBtn');
        const camBtn = document.getElementById('camBtn');
        const micBtn = document.getElementById('micBtn');
        const userInput = document.getElementById('userInput');
        const chatBox = document.getElementById('messages');

        // وظيفة الإرسال وعرض الرسالة في الصفحة
        sendBtn.onclick = () => {
            const text = userInput.value;
            if (text) {
                const div = document.createElement('div');
                div.className = 'msg-bubble';
                div.textContent = text;
                chatBox.appendChild(div);
                userInput.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        };

        // تفعيل الكاميرا
        camBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                alert("تم تشغيل الكاميرا بنجاح!");
                stream.getTracks().forEach(t => t.stop()); 
            } catch (e) {
                alert("يرجى السماح بالوصول للكاميرا من إعدادات المتصفح");
            }
        };

        // تفعيل الميكروفون
        micBtn.onclick = async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                alert("الميكروفون جاهز للعمل!");
            } catch (e) {
                alert("يرجى السماح بالوصول للميكروفون");
            }
        };
    </script>
</body>
</html>
