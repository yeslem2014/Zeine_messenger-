<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeine Messenger</title>
    <style>
        :root { --wa-green: #075e54; --bg-chat: #e5ddd5; --msg-sent: #dcf8c6; }
        body { font-family: sans-serif; background: var(--bg-chat); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: var(--wa-green); color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chatArea { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* تصميم فقاعات الدردشة */
        .msg { max-width: 85%; padding: 8px; border-radius: 10px; position: relative; box-shadow: 0 1px 1px rgba(0,0,0,0.1); word-wrap: break-word; }
        .sent { background: var(--msg-sent); align-self: flex-end; border-bottom-left-radius: 2px; }
        audio { width: 240px; height: 40px; display: block; margin-top: 5px; }
        img { max-width: 100%; border-radius: 8px; }

        /* شريط الإرسال السفلي */
        .footer { background: #f0f0f0; padding: 8px; display: flex; align-items: center; gap: 8px; }
        .input-container { background: white; border-radius: 25px; flex: 1; display: flex; align-items: center; padding: 5px 12px; }
        input[type="text"] { border: none; flex: 1; padding: 10px; outline: none; background: transparent; font-size: 16px; }
        
        .icon-btn { background: none; border: none; font-size: 22px; color: #555; cursor: pointer; padding: 5px; }
        .action-btn { background: var(--wa-green); color: white; width: 50px; height: 50px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .recording { background: #e91e63; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="header">نظام Zeine المطور</div>

<div id="chatArea">
    </div>

<div class="footer">
    <div class="input-container">
        <button class="icon-btn">📷</button>
        <input type="text" id="t-in" placeholder="رسالة">
        <button class="icon-btn">📎</button>
    </div>
    <button id="mic-btn" class="action-btn">🎤</button>
</div>

<script>
    let aCtx, proc, sObj, aLeft = [], aLen = 0, isRec = false;
    const mBtn = document.getElementById('mic-btn');
    const area = document.getElementById('chatArea');

    mBtn.onclick = async () => {
        if (isRec) {
            stopRecording();
        } else {
            startRecording();
        }
    };

    async function startRecording() {
        try {
            sObj = await navigator.mediaDevices.getUserMedia({ audio: true });
            aCtx = new (window.AudioContext || window.webkitAudioContext)();
            const src = aCtx.createMediaStreamSource(sObj);
            proc = aCtx.createScriptProcessor(4096, 1, 1);
            
            aLeft = []; aLen = 0; isRec = true;
            
            proc.onaudioprocess = (e) => {
                if (!isRec) return;
                const data = e.inputBuffer.getChannelData(0);
                aLeft.push(new Float32Array(data));
                aLen += data.length;
            };

            src.connect(proc);
            proc.connect(aCtx.destination);
            
            mBtn.classList.add('recording');
            mBtn.innerHTML = "⏹";
        } catch (err) {
            alert("تأكد من إعطاء صلاحية الميكروفون");
        }
    }

    function stopRecording() {
        isRec = false;
        mBtn.classList.remove('recording');
        mBtn.innerHTML = "🎤";

        if (proc) proc.disconnect();
        if (sObj) sObj.getTracks().forEach(t => t.stop());

        // دمج البيانات وتحويلها لملف WAV
        const buf = new Float32Array(aLen);
        let off = 0;
        for (let chunk of aLeft) {
            buf.set(chunk, off);
            off += chunk.length;
        }

        const wavBlob = createWav(buf, aCtx.sampleRate);
        const url = URL.createObjectURL(wavBlob);
        
        // إرسال التسجيل إلى واجهة الدردشة
        appendMessage(`<audio src="${url}" controls></audio>`, 'sent');
    }

    function appendMessage(html, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = html;
        area.appendChild(div);
        area.scrollTop = area.scrollHeight; // التمرير للأسفل تلقائياً
    }

    function createWav(samples, sRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const writeString = (off, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
        };

        writeString(0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(8, 'WAVE');
        writeString(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sRate, true);
        view.setUint32(28, sRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, 'data');
        view.setUint32(40, samples.length * 2, true);

        let offset = 44;
        for (let i = 0; i < samples.length; i++, offset += 2) {
            let s = Math.max(-1, Math.min(1, samples[i]));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        }
        return new Blob([view], { type: 'audio/wav' });
    }
</script>

</body>
</html>
