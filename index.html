<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام التواصل الاحترافي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --whatsapp-green: #075e54; --bg-color: #efe7de; }
        body { font-family: sans-serif; background: var(--bg-color); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--whatsapp-green); color: white; padding: 15px; text-align: center; font-weight: bold; z-index: 1000; }
        #videoArea { width: 100%; display: none; background: #000; position: relative; }
        video { width: 100%; height: 280px; object-fit: cover; border-bottom: 3px solid #128c7e; display: block; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 85px; }
        .msg { background: #dcf8c6; padding: 10px 15px; border-radius: 15px; align-self: flex-end; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #ccc; z-index: 1001; }
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; }
        i { color: #51585c; font-size: 24px; cursor: pointer; padding: 5px; }
        .active { color: #128c7e !important; }
        .mic-on { color: #e74c3c !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <header>نظام العائلة - متصل</header>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <i class="fas fa-sync" id="btnSwitch"></i>
        <i class="fas fa-video" id="btnStream"></i>
        <i class="fas fa-camera" id="btnCapture"></i>
        <i class="fas fa-microphone" id="btnMic"></i>
        <input type="text" id="userInput" placeholder="اكتب رسالة..." enterkeyhint="send">
        <i class="fas fa-paper-plane" id="btnSend" style="color:#128c7e"></i>
    </div>

    <script>
        const btnStream = document.getElementById('btnStream'), btnSwitch = document.getElementById('btnSwitch'), btnMic = document.getElementById('btnMic');
        const webcam = document.getElementById('webcam'), videoArea = document.getElementById('videoArea'), chat = document.getElementById('chat'), userInput = document.getElementById('userInput');
        
        let mainStream = null;
        let isRear = false;

        async function initMedia(video = true, audio = true) {
            try {
                const constraints = {
                    video: video ? { facingMode: isRear ? "environment" : "user" } : false,
                    audio: audio
                };
                
                if (mainStream) mainStream.getTracks().forEach(t => t.stop());
                
                mainStream = await navigator.mediaDevices.getUserMedia(constraints);
                webcam.srcObject = mainStream;
                
                if (video) videoArea.style.display = "block";
                btnStream.classList.toggle('active', video);
                btnMic.classList.toggle('mic-on', audio);
                
                console.log("تم تفعيل الوسائط بنجاح");
            } catch (err) {
                console.error("خطأ في الوصول:", err);
                alert("يرجى التأكد من الضغط على 'سماح' عند طلب الميكروفون");
            }
        }

        btnStream.onclick = () => {
            if (mainStream && mainStream.getVideoTracks().length > 0) {
                mainStream.getVideoTracks().forEach(t => t.stop());
                videoArea.style.display = "none";
                btnStream.classList.remove('active');
            } else {
                initMedia(true, true);
            }
        };

        btnMic.onclick = () => {
            if (mainStream && mainStream.getAudioTracks().length > 0) {
                const audioTrack = mainStream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                btnMic.classList.toggle('mic-on', audioTrack.enabled);
            } else {
                initMedia(false, true);
            }
        };

        btnSwitch.onclick = () => {
            isRear = !isRear;
            if (mainStream) initMedia(true, true);
        };

        function sendMessage() {
            if (userInput.value.trim()) {
                const d = document.createElement('div');
                d.className = 'msg';
                d.textContent = userInput.value;
                chat.appendChild(d);
                userInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        document.getElementById('btnSend').onclick = sendMessage;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
