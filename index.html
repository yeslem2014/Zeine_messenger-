<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام التواصل - تحديث الميكروفون</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; height: 100vh; display: flex; flex-direction: column; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; }
        #status { background: #ffebee; color: #c62828; padding: 5px; font-size: 12px; text-align: center; display: none; }
        #videoArea { width: 100%; display: none; background: #000; }
        video { width: 100%; height: 250px; object-fit: cover; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #dcf8c6; padding: 10px; border-radius: 10px; align-self: flex-end; }
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #ccc; }
        i { font-size: 24px; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .mic-active { color: #e74c3c; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        input { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<header>نظام العائلة الاحترافي</header>
<div id="status">يجب تفعيل إذن الميكروفون من إعدادات المتصفح</div>

<div id="videoArea">
    <video id="webcam" autoplay playsinline muted></video>
</div>

<div id="chat"></div>

<div class="input-bar">
    <i class="fas fa-video" id="btnVideo"></i>
    <i class="fas fa-microphone" id="btnMic"></i>
    <input type="text" id="userInput" placeholder="اكتب رسالة...">
    <i class="fas fa-paper-plane" id="btnSend" style="color:#128c7e"></i>
</div>

<script>
    const btnMic = document.getElementById('btnMic');
    const btnVideo = document.getElementById('btnVideo');
    const webcam = document.getElementById('webcam');
    const videoArea = document.getElementById('videoArea');
    const statusDiv = document.getElementById('status');
    
    let currentStream = null;

    // وظيفة لمنع القوائم المنبثقة عند الضغط المطول
    window.oncontextmenu = function(event) {
        if (event.target.tagName === 'I') {
            event.preventDefault();
            event.stopPropagation();
            return false;
        }
    };

    async function startMedia(useVideo, useAudio) {
        try {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            currentStream = await navigator.mediaDevices.getUserMedia({
                video: useVideo,
                audio: useAudio
            });

            if (useVideo) {
                webcam.srcObject = currentStream;
                videoArea.style.display = "block";
                btnVideo.style.color = "#128c7e";
            }

            if (useAudio) {
                btnMic.classList.add('mic-active');
                alert("الميكروفون يعمل الآن بنجاح");
            }
            
            statusDiv.style.display = "none";
        } catch (err) {
            console.error(err);
            statusDiv.style.display = "block";
            statusDiv.innerText = "خطأ: " + err.message;
        }
    }

    // استخدام 'touchstart' بدلاً من 'click' لتفادي مشاكل المتصفح
    btnMic.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startMedia(false, true);
    });

    btnMic.onclick = () => startMedia(false, true);

    btnVideo.onclick = () => startMedia(true, true);

    document.getElementById('btnSend').onclick = function() {
        const text = document.getElementById('userInput').value;
        if(text) {
            const m = document.createElement('div');
            m.className = 'msg';
            m.textContent = text;
            document.getElementById('chat').appendChild(m);
            document.getElementById('userInput').value = "";
        }
    };
</script>

</body>
</html>
