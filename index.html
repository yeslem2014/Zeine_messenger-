<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نظام العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --green: #075e54; --bg: #efe7de; }
        
        /* ضبط الشاشة بالكامل ومنع التداخل مع الساعة أو أزرار النظام */
        body { 
            font-family: sans-serif; 
            background: var(--bg); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        header { 
            background: var(--green); 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        #videoArea { width: 100%; display: none; background: #000; }
        video { width: 100%; height: auto; max-height: 35vh; object-fit: cover; border-bottom: 3px solid #128c7e; }

        #chat { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-bottom: 70px; /* مسافة لشريط الإدخال */
        }
        
        .msg { background: #dcf8c6; padding: 10px 15px; border-radius: 15px; align-self: flex-end; max-width: 80%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .img-msg { align-self: flex-end; max-width: 70%; border-radius: 10px; overflow: hidden; border: 2px solid white; }
        .img-msg img { width: 100%; display: block; }

        /* شريط الإدخال ثابت ومرئي دائماً */
        .input-bar { 
            background: #f0f0f0; 
            padding: 10px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            position: fixed; 
            bottom: env(safe-area-inset-bottom); 
            width: 100%; 
            box-sizing: border-box; 
            border-top: 1px solid #ccc;
            z-index: 1000;
        }
        
        input { flex: 1; padding: 12px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; }
        i { color: #51585c; font-size: 24px; cursor: pointer; }
        .active { color: #128c7e !important; }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة</header>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <i class="fas fa-video" id="btnStream"></i>
        <i class="fas fa-camera" id="btnCapture"></i>
        <i class="fas fa-microphone" id="btnMic"></i>
        <input type="text" id="userInput" placeholder="اكتب رسالة..." enterkeyhint="send">
        <i class="fas fa-paper-plane" style="color:#128c7e" id="btnSend"></i>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const btnStream = document.getElementById('btnStream');
        const btnCapture = document.getElementById('btnCapture');
        const btnMic = document.getElementById('btnMic');
        const videoArea = document.getElementById('videoArea');
        const webcam = document.getElementById('webcam');
        const chat = document.getElementById('chat');
        const userInput = document.getElementById('userInput');
        const canvas = document.getElementById('canvas');

        let stream = null;

        // تشغيل وإغلاق البث
        btnStream.onclick = async () => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                videoArea.style.display = "none";
                btnStream.classList.remove('active');
            } else {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                    webcam.srcObject = stream;
                    videoArea.style.display = "block";
                    btnStream.classList.add('active');
                    btnMic.classList.add('active'); // تفعيل الميكروفون تلقائياً مع البث
                    webcam.play();
                } catch (e) { alert("يرجى التأكد من إعطاء صلاحية الكاميرا"); }
            }
        };

        // التقاط صورة من البث
        btnCapture.onclick = () => {
            if (stream) {
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;
                canvas.getContext('2d').drawImage(webcam, 0, 0);
                const data = canvas.toDataURL('image/jpeg');
                const div = document.createElement('div');
                div.className = 'img-msg';
                div.innerHTML = `<img src="${data}">`;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            } else {
                alert("شغل البث أولاً لالتقاط صورة");
            }
        };

        // وظيفة الإرسال
        function send() {
            if (userInput.value.trim()) {
                const div = document.createElement('div');
                div.className = 'msg';
                div.textContent = userInput.value;
                chat.appendChild(div);
                userInput.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        document.getElementById('btnSend').onclick = send;
        userInput.onkeypress = (e) => { if(e.key === "Enter") send(); };

        // زر الميكروفون المستقل
        btnMic.onclick = async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                btnMic.classList.add('active');
                alert("الميكروفون يعمل");
            } catch (e) { alert("تحقق من إذن الميكروفون"); }
        };
    </script>
</body>
</html>
