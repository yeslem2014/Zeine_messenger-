<div id="recordingsList"></div>

<div style="text-align: center; margin-top: 20px;">
    <button id="recordButton" style="background: #006655; border: none; border-radius: 50%; padding: 15px; cursor: pointer;">
        <img id="micIcon" src="https://img.icons8.com/m_rounded/25/ffffff/microphone.png" alt="Mic">
    </button>
    <p id="status" style="color: #666; font-size: 14px;">اضغط للتسجيل</p>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    const recordButton = document.getElementById('recordButton');
    const statusText = document.getElementById('status');
    const recordingsList = document.getElementById('recordingsList');

    recordButton.addEventListener('click', async () => {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            stopRecording();
        } else {
            startRecording();
        }
    });

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // تحديد التنسيق المدعوم (WebM Opus هو الأفضل للمتصفحات الحديثة)
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            
            audioChunks = [];
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                const audioUrl = URL.createObjectURL(audioBlob);
                addAudioToUI(audioUrl);
                
                // هنا يمكنك إضافة كود إرسال الـ Blob إلى السيرفر الخاص بك
            };

            mediaRecorder.start();
            statusText.innerText = "جاري التسجيل... انقر للإيقاف";
            recordButton.style.backgroundColor = "#cc0000"; // تغيير اللون للأحمر أثناء التسجيل
        } catch (err) {
            console.error("تعذر الوصول للميكروفون:", err);
            alert("يرجى السماح بالوصول للميكروفون.");
        }
    }

    function stopRecording() {
        mediaRecorder.stop();
        // إيقاف جميع مسارات الميكروفون لتوفير الطاقة وإغلاق ضوء الميكروفون
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        
        statusText.innerText = "تم التسجيل";
        recordButton.style.backgroundColor = "#006655";
    }

    function addAudioToUI(url) {
        const audioWrapper = document.createElement('div');
        audioWrapper.style.cssText = "background: #e1f5fe; padding: 10px; border-radius: 15px; margin: 10px; display: inline-block; width: 80%;";
        
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = url;
        audio.style.width = "100%";
        
        audioWrapper.appendChild(audio);
        recordingsList.appendChild(audioWrapper);
        
        // التمرير لأسفل تلقائياً لرؤية التسجيل الجديد
        recordingsList.scrollTop = recordingsList.scrollHeight;
    }
</script>
