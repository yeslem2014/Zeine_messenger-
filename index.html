<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #status { background: #075e54; color: white; padding: 15px; text-align: center; }
        #videoArea { width: 100%; display: none; background: #000; line-height: 0; }
        video { width: 100%; height: auto; border-bottom: 3px solid #128c7e; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; }
        .input-bar { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 10px; border-radius: 20px; border: none; }
        i { color: #51585c; font-size: 24px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status">نظام العائلة - متصل</div>

    <div id="videoArea">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div id="chat"></div>

    <div class="input-bar">
        <i class="fas fa-camera" id="btnCam"></i>
        <i class="fas fa-microphone" id="btnMic"></i>
        <input type="text" placeholder="اكتب هنا...">
        <i class="fas fa-paper-plane" style="color:#128c7e"></i>
    </div>

    <script>
        const btnCam = document.getElementById('btnCam');
        const videoArea = document.getElementById('videoArea');
        const webcam = document.getElementById('webcam');

        btnCam.onclick = async () => {
            try {
                // طلب الكاميرا بشكل مباشر وصريح
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" } 
                });
                
                // ربط البث بالعنصر وإظهاره
                webcam.srcObject = stream;
                videoArea.style.display = "block";
                
                // إجبار الفيديو على العمل
                webcam.play();
                
            } catch (err) {
                alert("يجب الضغط على 'سماح' لتشغيل الكاميرا");
            }
        };

        document.getElementById('btnMic').onclick = async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                alert("الميكروفون متصل");
            } catch (e) { alert("تم رفض الإذن"); }
        };
    </script>
</body>
</html>
