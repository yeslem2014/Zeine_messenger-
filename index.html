<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>اصلاح مسجل الصوت - Zeine</title>
    <style>
        body { margin: 0; background: #e5ddd5; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* تصميم فقاعة الرسالة الصوتية */
        .msg { background: #dcf8c6; padding: 8px; border-radius: 12px; align-self: flex-end; width: fit-content; box-shadow: 0 1px 2px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 5px; }
        .msg audio { max-width: 260px; height: 40px; }
        .msg-title { font-size: 11px; color: #075e54; font-weight: bold; }
        .msg-time { font-size: 10px; color: #777; align-self: flex-end; }

        .footer { height: 140px; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 1px solid #ccc; }
        #mic { width: 75px; height: 75px; border-radius: 50%; border: none; background: #075e54; color: white; font-size: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; outline: none; }
        
        .recording { background: #ff4d4d !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #status { margin-top: 8px; font-size: 13px; color: #555; font-weight: bold; }
    </style>
</head>
<body>

<header>نظام تواصل العائلة - Zeine</header>
<div id="chat"></div>

<div class="footer">
    <button id="mic">🎤</button>
    <div id="status">انقر على الميكروفون للتسجيل</div>
</div>

<script>
    const micBtn = document.getElementById('mic');
    const chatBox = document.getElementById('chat');
    const statusTxt = document.getElementById('status');

    let mediaRecorder;
    let audioChunks = [];
    let stream = null;

    micBtn.onclick = async () => {
        // إذا كان التسجيل متوقفاً، نبدأ تسجيل جديد
        if (!mediaRecorder || mediaRecorder.state === "inactive") {
            try {
                // طلب صلاحية الميكروفون من المستخدم
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // تحديد أفضل صيغة يدعمها المتصفح تلقائياً (تجنباً لمشاكل mp3)
                let options = { mimeType: 'audio/webm' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'audio/ogg' }; // للهواتف والمتصفحات القديمة
                }

                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = []; // تفريغ البيانات السابقة

                // تجميع البيانات الصوتية أثناء التسجيل
                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };

                // معالجة الصوت فور الضغط على زر الإيقاف
                mediaRecorder.onstop = () => {
                    // دمج البيانات الصوتية وإنشاء ملف ميموري مؤقت وصالح
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    // توليد وقت إرسال الرسالة الحالي
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                    // بناء عنصر الرسالة داخل صندوق المحادثة
                    const div = document.createElement('div');
                    div.className = 'msg';
                    div.innerHTML = `
                        <span class="msg-title">رسالة صوتية</span>
                        <audio src="${audioUrl}" controls></audio>
                        <span class="msg-time">${timeStr}</span>
                    `;
                    
                    chatBox.appendChild(div);
                    chatBox.scrollTop = chatBox.scrollHeight; // النزول التلقائي لآخر رسالة

                    // إغلاق الميكروفون تماماً لتحرير موارد الجهاز وحفظ البطارية
                    if (stream) {
                        stream.getTracks().forEach(track => track.stop());
                    }
                };

                // تشغيل التسجيل فعلياً
                mediaRecorder.start();
                
                // تحديث شكل الزر والنص للمستخدم
                micBtn.classList.add('recording');
                micBtn.innerText = "🛑";
                statusTxt.innerText = "جاري التسجيل الآن... انقر للإرسال";

            } catch (err) {
                console.error("خطأ في الميكروفون:", err);
                alert("تعذر الوصول للميكروفون. يرجى تفعيل الصلاحية من إعدادات المتصفح وقفل أي تطبيق آخر يستخدمه.");
            }
        } else {
            // إيقاف التسجيل وتوليد الرسالة فوراً
            mediaRecorder.stop();
            micBtn.classList.remove('recording');
            micBtn.innerText = "🎤";
            statusTxt.innerText = "تم الإرسال! انقر للتسجيل مجدداً";
        }
    };
</script>

</body>
</html>
