<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام التواصل</title>
    <!-- رابط مكتبة الأيقونات المحدث -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #efe7de; font-family: sans-serif; }
        
        header { 
            position: absolute; top: 0; left: 0; right: 0; height: 55px;
            background: #075e54; color: white; display: flex; align-items: center; 
            justify-content: center; font-weight: bold; z-index: 100;
        }

        #videoArea { 
            position: absolute; top: 55px; left: 0; right: 0; height: 250px;
            background: #000; display: none; z-index: 10; border-bottom: 2px solid #128c7e;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        #chat { 
            position: absolute; top: 55px; bottom: 70px; left: 0; right: 0;
            overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: #e5ddd5;
            transition: top 0.3s ease;
        }

        .msg { background: #dcf8c6; padding: 10px; border-radius: 12px; align-self: flex-end; max-width: 85%; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }

        .footer { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: #f0f0f0; display: flex; align-items: center; padding: 0 5px;
            border-top: 1px solid #ccc; z-index: 100; gap: 5px;
        }

        .btn { background: none; border: none; padding: 8px; color: #54656f; font-size: 20px; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.9); }
        
        /* ألوان التفعيل */
        .active-mic { color: #128c7e !important; }
        .active-vid { color: #128c7e !important; }
        .mic-off { color: #e74c3c !important; }

        input { flex: 1; border: none; padding: 12px; border-radius: 25px; font-size: 15px; outline: none; background: white; }
    </style>
</head>
<body>

    <header>نظام تواصل العائلة</header>

    <div id="videoArea"><video id="v" autoplay playsinline></video></div>

    <div id="chat"></div>

    <div class="footer">
        <!-- أيقونة تبديل الكاميرا -->
        <button class="btn" id="tglCam" title="تبديل الكاميرا"><i class="fas fa-camera-rotate"></i></button>
        <!-- أيقونة تشغيل/إيقاف الفيديو -->
        <button class="btn" id="tglVid" title="تشغيل الكاميرا"><i class="fas fa-video"></i></button>
        <!-- أيقونة الميكروفون -->
        <button class="btn" id="tglMic" title="الميكروفون"><i class="fas fa-microphone"></i></button>
        
        <input type="text" id="m" placeholder="اكتب رسالة...">
        
        <!-- زر الإرسال -->
        <button class="btn" id="sendBtn"><i class="fas fa-paper-plane" style="color:#128c7e"></i></button>
    </div>

    <script>
        const v = document.getElementById('v'), 
              chat = document.getElementById('chat'), 
              m = document.getElementById('m'),
              vArea = document.getElementById('videoArea'), 
              tglVid = document.getElementById('tglVid'), 
              tglMic = document.getElementById('tglMic'),
              tglCam = document.getElementById('tglCam');

        let stream = null, isRear = false;

        async function startMedia() {
            // إنهاء البث القديم إن وجد
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
            }

            const constraints = {
                video: { facingMode: isRear ? "environment" : "user" },
                audio: true
            };

            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                v.srcObject = stream;
                vArea.style.display = "block";
                chat.style.top = "305px"; // إزاحة الشات لأسفل
                tglVid.classList.add('active-vid');
                tglMic.classList.add('active-mic');
                tglMic.classList.remove('mic-off');
            } catch (e) {
                alert("يرجى السماح بالوصول للكاميرا والميكروفون");
                console.error(e);
            }
        }

        // تشغيل/إيقاف الكاميرا بالكامل
        tglVid.onclick = () => {
            if (stream && stream.getVideoTracks().length > 0 && vArea.style.display === "block") {
                stream.getTracks().forEach(t => t.stop());
                vArea.style.display = "none";
                chat.style.top = "55px";
                tglVid.classList.remove('active-vid');
                stream = null;
            } else {
                startMedia();
            }
        };

        // تبديل الكاميرا أمامية/خلفية
        tglCam.onclick = () => {
            isRear = !isRear;
            if (stream) startMedia();
        };

        // كتم وصوت الميكروفون
        tglMic.onclick = () => {
            if (stream) {
                const audioTrack = stream.getAudioTracks()[0];
                if (audioTrack) {
                    audioTrack.enabled = !audioTrack.enabled;
                    tglMic.classList.toggle('active-mic', audioTrack.enabled);
                    tglMic.classList.toggle('mic-off', !audioTrack.enabled);
                    // تغيير الأيقونة عند الكتم
                    const icon = tglMic.querySelector('i');
                    icon.className = audioTrack.enabled ? 'fas fa-microphone' : 'fas fa-microphone-slash';
                }
            }
        };

        function send() {
            if (m.value.trim()) {
                const d = document.createElement('div');
                d.className = 'msg'; 
                d.textContent = m.value;
                chat.appendChild(d); 
                m.value = "";
                chat.scrollTop = chat.scrollHeight;
            }
        }

        document.getElementById('sendBtn').onclick = send;
        m.onkeypress = (e) => { if(e.key === "Enter") send(); };
    </script>
</body>
</html>
