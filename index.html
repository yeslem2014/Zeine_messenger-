<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeine - العائلة</title>
    <style>
        body { margin: 0; background: #e5ddd5; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { background: #dcf8c6; padding: 10px; border-radius: 15px; align-self: flex-end; width: 85%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        audio { width: 100%; height: 45px; }
        .footer { height: 100px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; border-top: 1px solid #ccc; }
        #micBtn { width: 65px; height: 65px; border-radius: 50%; border: none; background: #075e54; color: white; font-size: 25px; cursor: pointer; }
        .recording { background: #ff4d4d !important; transform: scale(1.1); transition: 0.3s; }
    </style>
</head>
<body>

<header>نظام Zeine الصوتي</header>
<div id="chat"></div>

<div class="footer">
    <button id="micBtn">🎤</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/RecordRTC/5.6.2/RecordRTC.js"></script>
<script>
    const btn = document.getElementById('micBtn');
    const chat = document.getElementById('chat');
    let recorder;

    btn.onclick = async () => {
        if (!recorder || recorder.getState() === "inactive") {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                recorder = new RecordRTC(stream, { type: 'audio', mimeType: 'audio/wav' });
                recorder.startRecording();
                btn.classList.add('recording');
                btn.innerText = "🛑";
            } catch (e) { alert("يرجى الضغط على 'سماح' للميكروفون"); }
        } else {
            recorder.stopRecording(() => {
                const url = URL.createObjectURL(recorder.getBlob());
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<audio src="${url}" controls></audio>`;
                chat.appendChild(div);
                
                // إغلاق المسار لتحرير الميكروفون
                recorder.getInternalRecorder().stream.getTracks().forEach(t => t.stop());
                
                btn.classList.remove('recording');
                btn.innerText = "🎤";
                chat.scrollTop = chat.scrollHeight;
            });
        }
    };
</script>
</body>
</html>
