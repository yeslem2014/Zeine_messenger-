<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هاتف العائلة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #efe7de; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #status { background: #075e54; color: white; padding: 15px; text-align: center; font-weight: bold; }
        #chatBox { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        /* مربع الفيديو المطور */
        #videoContainer { 
            width: 90%; 
            margin: 10px auto; 
            display: none; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 4px solid #128c7e; 
            background: #000;
        }
        video { width: 100%; height: auto; display: block; }

        .input-area { background: #f0f0f0; padding: 10px; display: flex; align-items: center; gap: 10px; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; border-top: 1px solid #ddd; }
        .input-area input { flex: 1; padding: 12px; border-radius: 25px; border: none; outline: none; }
        i { color: #51585c; font-size: 26px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="status">نظام تواصل العائلة - متصل</div>

    <div id="chatBox">
        <div id="videoContainer">
            <video id="myVideo" autoplay playsinline muted></video>
        </div>
    </div>

    <div class="input-area">
        <i class="fas fa-camera" id="camBtn"></i>
        <i class="fas fa-microphone" id="micBtn"></i>
        <input type="text" id="msgInput" placeholder="اكتب رسالة...">
        <i class="fas fa-paper-plane" style="color:#128c7e" id="sendBtn"></i>
    </div>

    <script>
        const camBtn = document.getElementById('camBtn');
        const videoCont = document.getElementById('videoContainer');
        const myVideo = document.getElementById('myVideo');

        // وظيفة تشغيل الكاميرا "الحقيقية"
        camBtn.onclick = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, // تحديد الكاميرا الأمامية
                    audio: true 
                });
                
                myVideo.srcObject = stream;
                videoCont.style.display = "block"; // إظهار المربع فوراً
                
                // التأكد من تشغيل الفيديو يدوياً لضمان العمل على الأندرويد
                myVideo.play();
                
            } catch (err) {
                alert("تنبيه: يجب الضغط على 'سماح' وتأكد أن الكاميرا ليست مستخدمة في تطبيق آخر");
            }
        };

        // وظيفة الميكروفون
        document.getElementById('micBtn').onclick = async () => {
            try {
                await navigator.mediaDevices.getUserMedia({ audio: true });
                alert("تم تفعيل الميكروفون بنجاح");
            } catch (e) {
                alert("لم يتم السماح بالوصول للميكروفون");
            }
        };
    </script>
</body>
</html>
