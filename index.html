<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار الميكروفون فقط</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; }
        .test-box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; margin: 10px; color: white; font-weight: bold; }
        #startBtn { background: #25d366; }
        #muteBtn { background: #075e54; display: none; }
        .status { margin-top: 20px; color: #555; }
        .indicator { width: 50px; height: 50px; border-radius: 50%; background: #ccc; margin: 20px auto; transition: 0.3s; }
        .recording { background: #ff4d4d; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="test-box">
        <h2>اختبار الميكروفون 🎤</h2>
        <div id="indicator" class="indicator"></div>
        <button id="startBtn">بدء الاختبار</button>
        <button id="muteBtn">كتم الصوت</button>
        <div class="status" id="status">اضغط على "بدء الاختبار" واسمح للمتصفح بالوصول للميكروفون</div>
    </div>

    <audio id="audioPlayback" autoplay></audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const muteBtn = document.getElementById('muteBtn');
        const status = document.getElementById('status');
        const indicator = document.getElementById('indicator');
        const audioPlayback = document.getElementById('audioPlayback');

        let stream = null;

        startBtn.onclick = async () => {
            try {
                // طلب الميكروفون فقط
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // ربط الميكروفون بعنصر الصوت لتسمع نفسك (Echo)
                audioPlayback.srcObject = stream;
                
                // تحديث الواجهة
                startBtn.style.display = 'none';
                muteBtn.style.display = 'inline-block';
                indicator.classList.add('recording');
                status.innerText = "الاختبار يعمل! تحدث الآن ويجب أن تسمع صوتك من السماعة.";
                
            } catch (err) {
                status.innerText = "خطأ: لم نتمكن من الوصول للميكروفون. (تأكد من الصلاحيات)";
                console.error(err);
            }
        };

        muteBtn.onclick = () => {
            if (stream) {
                const audioTrack = stream.getAudioTracks()[0];
                audioTrack.enabled = !audioTrack.enabled;
                
                if (audioTrack.enabled) {
                    muteBtn.innerText = "كتم الصوت";
                    muteBtn.style.background = "#075e54";
                    indicator.style.opacity = "1";
                    status.innerText = "الميكروفون يعمل الآن.";
                } else {
                    muteBtn.innerText = "إلغاء الكتم";
                    muteBtn.style.background = "#ff4d4d";
                    indicator.style.opacity = "0.3";
                    status.innerText = "تم كتم الميكروفون برمجيًا.";
                }
            }
        };
    </script>
</body>
</html>
