<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام Zeine المطور</title>
    <style>
        body { font-family: sans-serif; background: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 25px; text-align: center; font-size: 24px; font-weight: bold; }
        #chatArea { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        /* فقاعة صوتية ضخمة وواضحة جداً */
        .audio-card { 
            background: #ffffff; padding: 25px; border-radius: 20px; 
            width: 90%; align-self: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-right: 12px solid #25d366;
        }

        audio { width: 100%; height: 65px; outline: none; }

        /* أزرار تحكم عملاقة لراحة اليد والعين */
        .footer { background: #f0f0f0; padding: 40px; text-align: center; border-top: 2px solid #ccc; }
        
        #recordBtn { 
            width: 120px; height: 120px; border-radius: 50%; border: none; 
            background: #075e54; color: white; font-size: 50px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.2s;
        }

        .recording-active { background: #d32f2f !important; transform: scale(1.15); }
        #msgInfo { margin-top: 20px; font-size: 22px; color: #000; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">نظام Zeine الصوتي</div>

<div id="chatArea"></div>

<div class="footer">
    <button id="recordBtn">🎤</button>
    <div id="msgInfo">اضغط للتحدث</div>
</div>

<script>
    let mediaRec;
    let streamObj;
    let chunks = [];

    const btn = document.getElementById('recordBtn');
    const info = document.getElementById('msgInfo');
    const area = document.getElementById('chatArea');

    btn.onclick = async () => {
        if (mediaRec && mediaRec.state === "recording") {
            mediaRec.stop();
            streamObj.getTracks().forEach(track => track.stop());
            btn.classList.remove('recording-active');
            btn.innerHTML = "🎤";
            info.innerText = "تم الحفظ بنجاح ✅";
            return;
        }

        try {
            // طلب الوصول للميكروفون بإعدادات تجبر المتصفح على التركيز
            streamObj = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
            
            // استخدام WebM مع Opus كونه التنسيق الأكثر استقراراً لسامسونج
            mediaRec = new MediaRecorder(streamObj, { mimeType: 'audio/webm;codecs=opus' });
            chunks = [];

            mediaRec.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            mediaRec.onstop = () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                
                const card = document.createElement('div');
                card.className = 'audio-card';
                card.innerHTML = `<audio src="${url}" controls></audio><div style="margin-top:10px; font-weight:bold; color:#075e54;">تسجيل صوتي جديد</div>`;
                
                area.appendChild(card);
                area.scrollTop = area.scrollHeight;
            };

            // إجبار المتصفح على جمع البيانات كل 500 ملي ثانية لضمان امتلاء الملف
            mediaRec.start(500); 
            btn.classList.add('recording-active');
            btn.innerHTML = "⏹️";
            info.innerText = "جاري التسجيل... اضغط للإيقاف";

        } catch (err) {
            alert("خطأ: يرجى السماح للمتصفح بالوصول للميكروفون من إعدادات سامسونج.");
        }
    };
</script>

</body>
</html>
